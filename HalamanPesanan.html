<!-- =====================================================
     HALAMAN DAFTAR PESANAN
     ===================================================== -->

<div class="page-header">
  <div class="page-title-row">
    <button class="mobile-toggle" onclick="toggleSidebar()">
      <span class="material-icons-round">menu</span>
    </button>
    <h1 class="page-title">Daftar Pesanan</h1>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <span id="pesanan-count" class="badge badge-warning" style="font-size:12px">0 pesanan</span>
    <button class="btn btn-secondary btn-sm" onclick="loadDaftarPesanan()" title="Refresh">
      <span class="material-icons-round" style="font-size:16px">refresh</span>
    </button>
  </div>
</div>

<div style="padding:16px 24px 24px;">
  <div id="pesanan-list-container">
    <div style="text-align:center;padding:60px 24px;color:var(--text-muted)">
      <span class="material-icons-round" style="font-size:48px;opacity:0.3">receipt_long</span>
      <p style="margin-top:12px">Memuat pesanan...</p>
    </div>
  </div>
</div>
