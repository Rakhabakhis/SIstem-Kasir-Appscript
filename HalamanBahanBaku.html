<!-- =====================================================
     HALAMAN BAHAN BAKU - Manajemen Bahan Baku & Resep
     ===================================================== -->

<div class="page-header">
  <div class="page-title-row">
    <button class="mobile-toggle" onclick="toggleSidebar()">
      <span class="material-icons-round">menu</span>
    </button>
    <h1 class="page-title">Bahan Baku</h1>
  </div>
  <button class="btn btn-primary" onclick="openTambahBahanBakuModal()">
    <span class="material-icons-round">add</span> Tambah Bahan Baku
  </button>
</div>

<!-- Alert Stok Rendah -->
<div id="bb-low-stock-alert" style="display:none;margin-bottom:16px;">
  <div style="background:var(--warning-bg);border:1px solid var(--warning);border-radius:var(--radius);padding:12px 16px;display:flex;align-items:center;gap:10px;">
    <span class="material-icons-round" style="color:var(--warning)">warning</span>
    <span id="bb-low-stock-text" style="font-size:13px;color:var(--warning);font-weight:500;flex:1"></span>
    <button class="btn btn-sm" onclick="document.getElementById('bb-low-stock-alert').style.display='none'" style="background:transparent;border:none;padding:0;cursor:pointer;">
      <span class="material-icons-round" style="font-size:16px;color:var(--warning)">close</span>
    </button>
  </div>
</div>

<div class="page-body">
  <!-- Tab Navigation -->
  <div class="tab-nav" style="display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--border);">
    <button id="bb-tab-daftar" class="tab-btn active" onclick="switchBBTab('daftar')"
      style="padding:10px 20px;border:none;background:none;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--primary);border-bottom-color:var(--primary);">
      <span class="material-icons-round" style="font-size:16px;vertical-align:middle;margin-right:4px">inventory_2</span>
      Daftar Bahan Baku
    </button>
    <button id="bb-tab-log" class="tab-btn" onclick="switchBBTab('log')"
      style="padding:10px 20px;border:none;background:none;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--text-muted);">
      <span class="material-icons-round" style="font-size:16px;vertical-align:middle;margin-right:4px">history</span>
      Log Perubahan Stok
    </button>
  </div>

  <!-- ===== TAB: DAFTAR BAHAN BAKU ===== -->
  <div id="bb-panel-daftar">
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-bar">
        <span class="material-icons-round">search</span>
        <input type="text" id="search-bahan" placeholder="Cari bahan baku..." oninput="filterBahanBaku()">
      </div>
      <div class="filter-row">
        <select id="filter-grup-bahan" class="form-control form-select" style="width:auto" onchange="filterBahanBaku()">
          <option value="">Semua Grup</option>
        </select>
        <select id="filter-status-bahan" class="form-control form-select" style="width:auto" onchange="filterBahanBaku()">
          <option value="">Semua Status</option>
          <option value="Aktif">Aktif</option>
          <option value="Nonaktif">Nonaktif</option>
        </select>
      </div>
    </div>

    <!-- Summary Cards -->
    <div class="stats-grid bb-stats-grid" style="margin-bottom:16px;">
      <div id="bb-stat-card-total" class="stat-card bb-stat-card bb-stat-card-active" onclick="setBBStatFilter('all')">
        <div class="stat-icon bb-stat-icon bb-stat-icon-total">
          <span class="material-icons-round">inventory_2</span>
        </div>
        <div class="stat-info">
          <div class="stat-value" id="bb-stat-total">0</div>
          <div class="stat-label">Total Bahan</div>
        </div>
      </div>
      <div id="bb-stat-card-lowstock" class="stat-card bb-stat-card" onclick="setBBStatFilter('lowstock')">
        <div class="stat-icon bb-stat-icon bb-stat-icon-low">
          <span class="material-icons-round">warning_amber</span>
        </div>
        <div class="stat-info">
          <div class="stat-value" id="bb-stat-lowstock">0</div>
          <div class="stat-label">Stok Rendah</div>
        </div>
      </div>
      <div id="bb-stat-card-habis" class="stat-card bb-stat-card" onclick="setBBStatFilter('habis')">
        <div class="stat-icon bb-stat-icon bb-stat-icon-empty">
          <span class="material-icons-round">block</span>
        </div>
        <div class="stat-info">
          <div class="stat-value" id="bb-stat-habis">0</div>
          <div class="stat-label">Stok Habis</div>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="card" style="overflow:hidden">
      <!-- Desktop Table -->
      <div class="bb-desktop-view" style="overflow-x:auto">
        <table class="data-table" id="bahan-table">
          <thead>
            <tr>
              <th style="width:90px">ID</th>
              <th>Nama Bahan</th>
              <th style="width:140px">Grup/Brand</th>
              <th style="width:90px;text-align:center">Stok</th>
              <th style="width:80px">Satuan</th>
              <th style="width:70px;text-align:center">Min.</th>
              <th style="width:90px">Status</th>
              <th style="width:120px">Aksi</th>
            </tr>
          </thead>
          <tbody id="bahan-tbody">
            <tr><td colspan="8" style="text-align:center;padding:20px;color:var(--text-muted)">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
      <!-- Mobile Card List -->
      <div class="bb-mobile-view" id="bahan-mobile-list" style="display:none;padding:10px"></div>
    </div>
  </div>

  <!-- ===== TAB: LOG BAHAN BAKU ===== -->
  <div id="bb-panel-log" style="display:none;">
    <div class="toolbar" style="flex-direction:column;gap:8px;">
      <!-- Baris 1: Search + Tipe + Refresh -->
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <div class="search-bar" style="flex:1;min-width:160px;">
          <span class="material-icons-round">search</span>
          <input type="text" id="search-log-bahan" placeholder="Cari nama bahan atau transaksi..." oninput="filterLogBahan()">
        </div>
        <select id="filter-tipe-log" class="form-control form-select" style="width:auto;min-width:130px" onchange="filterLogBahan()">
          <option value="">Semua Tipe</option>
          <option value="Masuk">Masuk</option>
          <option value="Keluar">Keluar</option>
          <option value="Penyesuaian">Penyesuaian</option>
        </select>
        <button class="btn btn-secondary btn-sm" onclick="loadLogBahanBaku()">
          <span class="material-icons-round" style="font-size:15px">refresh</span> Refresh
        </button>
      </div>
      <!-- Baris 2: Date range — selalu side by side (grid 2 kolom) -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div>
          <label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-muted);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px">
            <span class="material-icons-round" style="font-size:13px">event</span> Dari
          </label>
          <input type="date" id="filter-log-date-from" class="form-control" style="width:100%" onchange="filterLogBahan()">
        </div>
        <div>
          <label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-muted);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px">
            <span class="material-icons-round" style="font-size:13px">event</span> Sampai
          </label>
          <input type="date" id="filter-log-date-to" class="form-control" style="width:100%" onchange="filterLogBahan()">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="bb-desktop-view" style="overflow-x:auto">
        <table class="data-table" id="log-bahan-table">
          <thead>
            <tr>
              <th>Waktu</th>
              <th>Bahan Baku</th>
              <th style="text-align:center">Sebelum</th>
              <th style="text-align:center">Perubahan</th>
              <th style="text-align:center">Sesudah</th>
              <th style="width:130px">Tipe</th>
              <th>Keterangan</th>
              <th>Oleh</th>
            </tr>
          </thead>
          <tbody id="log-bahan-tbody">
            <tr><td colspan="8" style="text-align:center;padding:20px;color:var(--text-muted)">Belum ada log</td></tr>
          </tbody>
        </table>
      </div>
      <div class="bb-mobile-view" id="log-bahan-mobile-list" style="display:none;padding:10px"></div>
    </div>
  </div>
</div>

<script>
var _allBahanBaku = [];
var _allLogBahan = [];
var _bbStatFilter = 'all';

function switchBBTab(tab) {
  var panels = ['daftar', 'log'];
  panels.forEach(function(t) {
    var panel = document.getElementById('bb-panel-' + t);
    var btn = document.getElementById('bb-tab-' + t);
    if (panel) panel.style.display = (t === tab) ? '' : 'none';
    if (btn) {
      if (t === tab) {
        btn.style.color = 'var(--primary)';
        btn.style.borderBottomColor = 'var(--primary)';
      } else {
        btn.style.color = 'var(--text-muted)';
        btn.style.borderBottomColor = 'transparent';
      }
    }
  });
  if (tab === 'log') loadLogBahanBaku();
}

function loadBahanBakuPage() {
  var tbody = document.getElementById('bahan-tbody');
  if (tbody) tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:20px;color:var(--text-muted)"><div class="spinner" style="margin:0 auto"></div></td></tr>';

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        _allBahanBaku = res.data || [];
        populateGrupFilter();
        updateBBStatFilterUI();
        filterBahanBaku();
        updateBBStats();
        checkLowStockAlert();
      } else {
        if (tbody) tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:20px;color:var(--danger)">Gagal memuat data</td></tr>';
      }
    })
    .withFailureHandler(function(err) {
      if (tbody) tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:20px;color:var(--danger)">Error: ' + (err ? err.message : 'Gagal') + '</td></tr>';
    })
    .getAllBahanBaku();
}

function renderBahanBakuTable(data) {
  var tbody = document.getElementById('bahan-tbody');
  var mobileList = document.getElementById('bahan-mobile-list');
  if (!tbody) return;
  if (!data || data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--text-muted)">Belum ada bahan baku</td></tr>';
    if (mobileList) mobileList.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-muted)">Belum ada bahan baku</div>';
    return;
  }
  var html = '';
  var mobileHtml = '';
  var grupColors = ['#6366f1','#059669','#d97706','#0891b2','#e11d48','#7c3aed','#0d9488','#c2410c'];
  var grupColorMap = {};
  var grupIdx = 0;

  for (var i = 0; i < data.length; i++) {
    var b = data[i];
    var isLow = b.stok > 0 && b.stok <= b.stokMinimum && b.stokMinimum > 0;
    var isHabis = b.stok <= 0;
    var isNonaktif = b.status !== 'Aktif';
    var namaSafe = (b.nama || '').replace(/\'/g, '');

    // Consistent color per grup
    if (b.grup && !grupColorMap[b.grup]) {
      grupColorMap[b.grup] = grupColors[grupIdx % grupColors.length];
      grupIdx++;
    }
    var gc = b.grup ? grupColorMap[b.grup] : '';

    // Grup badge
    var grupBadge = b.grup
      ? '<span style="display:inline-flex;align-items:center;gap:4px;background:' + gc + '18;color:' + gc + ';border:1px solid ' + gc + '44;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700"><span class="material-icons-round" style="font-size:10px">sell</span>' + b.grup + '</span>'
      : '<span style="color:var(--text-muted);font-size:12px">—</span>';

    // Stok badge
    var stokBadge;
    if (isHabis) {
      stokBadge = '<span style="display:inline-flex;align-items:center;gap:3px;background:#fee2e2;color:#dc2626;font-weight:700;padding:3px 10px;border-radius:8px;font-size:12px"><span class="material-icons-round" style="font-size:12px">block</span>' + b.stok + '</span>';
    } else if (isLow) {
      stokBadge = '<span style="display:inline-flex;align-items:center;gap:3px;background:#fef3c7;color:#b45309;font-weight:700;padding:3px 10px;border-radius:8px;font-size:12px"><span class="material-icons-round" style="font-size:12px">warning_amber</span>' + b.stok + '</span>';
    } else {
      stokBadge = '<span style="font-weight:600;font-size:13px;color:var(--text)">' + b.stok + '</span>';
    }

    // Status badge
    var statusBadge = b.status === 'Aktif'
      ? '<span style="display:inline-flex;align-items:center;gap:3px;background:#d1fae5;color:#059669;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600"><span class="material-icons-round" style="font-size:11px">check_circle</span>Aktif</span>'
      : '<span style="display:inline-flex;align-items:center;gap:3px;background:#f3f4f6;color:#6b7280;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600"><span class="material-icons-round" style="font-size:11px">cancel</span>Nonaktif</span>';

    var rowStyle = isNonaktif ? 'opacity:0.6' : '';
    var borderLeft = isHabis ? 'border-left:3px solid #dc2626' : (isLow ? 'border-left:3px solid #d97706' : '');

    var aksiHtml =
      '<button class="btn btn-sm" style="background:linear-gradient(135deg,#059669,#34d399);color:#fff;border:none;min-width:32px" onclick="openRestokModal(\'' + b.id + '\',\'' + namaSafe + '\',\'' + b.satuan + '\')" title="Restok"><span class="material-icons-round" style="font-size:13px">add_circle</span></button>' +
      '<button class="btn btn-sm btn-secondary" style="min-width:32px" onclick="editBahanBakuForm(\'' + b.id + '\')" title="Edit"><span class="material-icons-round" style="font-size:13px">edit</span></button>' +
      '<button class="btn btn-sm btn-danger" style="min-width:32px" onclick="confirmHapusBahan(\'' + b.id + '\',\'' + namaSafe + '\')" title="Nonaktifkan"><span class="material-icons-round" style="font-size:13px">delete</span></button>';

    // Desktop row (8 col: ID, Nama, Grup, Stok, Satuan, Min, Status, Aksi)
    html += '<tr style="' + rowStyle + '">' +
      '<td style="font-size:11px;color:var(--text-muted);font-family:monospace">' + b.id + '</td>' +
      '<td><div style="font-weight:600;font-size:13px">' + b.nama + '</div>' +
        (b.keterangan ? '<div style="font-size:11px;color:var(--text-muted);margin-top:2px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + b.keterangan + '</div>' : '') +
      '</td>' +
      '<td>' + grupBadge + '</td>' +
      '<td style="text-align:center">' + stokBadge + '</td>' +
      '<td style="color:var(--text-muted);font-size:12px">' + b.satuan + '</td>' +
      '<td style="text-align:center;color:var(--text-muted);font-size:12px">' + (b.stokMinimum > 0 ? b.stokMinimum : '—') + '</td>' +
      '<td>' + statusBadge + '</td>' +
      '<td><div style="display:flex;gap:4px">' + aksiHtml + '</div></td>' +
      '</tr>';

    // Mobile card
    mobileHtml += '<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;' + rowStyle + ';' + borderLeft + '">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">' +
        '<div style="flex:1;min-width:0;margin-right:8px">' +
          '<div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + b.nama + '</div>' +
          '<div style="font-size:11px;color:var(--text-muted);margin-top:1px">' + b.id + '</div>' +
        '</div>' +
        '<div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">' + grupBadge + statusBadge + '</div>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px">' +
        '<div style="background:var(--bg);border-radius:8px;padding:8px;text-align:center">' +
          '<div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Stok</div>' +
          '<div>' + stokBadge + '</div>' +
        '</div>' +
        '<div style="background:var(--bg);border-radius:8px;padding:8px;text-align:center">' +
          '<div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Satuan</div>' +
          '<div style="font-size:12px;font-weight:600">' + b.satuan + '</div>' +
        '</div>' +
        '<div style="background:var(--bg);border-radius:8px;padding:8px;text-align:center">' +
          '<div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Min.</div>' +
          '<div style="font-size:12px;font-weight:600">' + (b.stokMinimum > 0 ? b.stokMinimum : '—') + '</div>' +
        '</div>' +
      '</div>' +
      (b.keterangan ? '<div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;padding:6px 10px;background:var(--bg);border-radius:6px">' + b.keterangan + '</div>' : '') +
      '<div style="display:flex;gap:6px;justify-content:flex-end">' + aksiHtml + '</div>' +
    '</div>';
  }
  tbody.innerHTML = html;
  if (mobileList) mobileList.innerHTML = mobileHtml;
}

function updateBBStats() {
  var total = _allBahanBaku.length;
  var lowstock = _allBahanBaku.filter(function(b) { return b.status === 'Aktif' && b.stok > 0 && b.stok <= b.stokMinimum && b.stokMinimum > 0; }).length;
  var habis = _allBahanBaku.filter(function(b) { return b.status === 'Aktif' && b.stok <= 0; }).length;
  var s = function(id, v) { var el = document.getElementById(id); if (el) el.textContent = v; };
  s('bb-stat-total', total);
  s('bb-stat-lowstock', lowstock);
  s('bb-stat-habis', habis);
}

function setBBStatFilter(filter) {
  _bbStatFilter = filter || 'all';
  updateBBStatFilterUI();
  filterBahanBaku();
}

function updateBBStatFilterUI() {
  var cards = [
    { id: 'bb-stat-card-total', filter: 'all' },
    { id: 'bb-stat-card-lowstock', filter: 'lowstock' },
    { id: 'bb-stat-card-habis', filter: 'habis' }
  ];
  for (var i = 0; i < cards.length; i++) {
    var el = document.getElementById(cards[i].id);
    if (!el) continue;
    if (cards[i].filter === _bbStatFilter) el.classList.add('bb-stat-card-active');
    else el.classList.remove('bb-stat-card-active');
  }
}

function checkLowStockAlert() {
  var lowItems = _allBahanBaku.filter(function(b) { return b.status === 'Aktif' && b.stok <= b.stokMinimum && b.stokMinimum > 0; });
  var alertEl = document.getElementById('bb-low-stock-alert');
  var textEl = document.getElementById('bb-low-stock-text');
  if (!alertEl || !textEl) return;
  if (lowItems.length > 0) {
    var names = lowItems.slice(0, 3).map(function(b) { return b.nama + ' (' + b.stok + ' ' + b.satuan + ')'; }).join(', ');
    if (lowItems.length > 3) names += ' dan ' + (lowItems.length - 3) + ' lainnya';
    textEl.textContent = '⚠️ ' + lowItems.length + ' bahan baku stok rendah: ' + names;
    alertEl.style.display = 'block';
  } else {
    alertEl.style.display = 'none';
  }
}

function populateGrupFilter() {
  var sel = document.getElementById('filter-grup-bahan');
  if (!sel) return;
  var grupSet = {};
  _allBahanBaku.forEach(function(b) { if (b.grup) grupSet[b.grup] = true; });
  var grups = Object.keys(grupSet).sort();
  var opts = '<option value="">Semua Grup</option>';
  grups.forEach(function(g) { opts += '<option value="' + g + '">' + g + '</option>'; });
  sel.innerHTML = opts;
}

function filterBahanBaku() {
  var keyword = (document.getElementById('search-bahan').value || '').toLowerCase();
  var grup = document.getElementById('filter-grup-bahan').value;
  var status = document.getElementById('filter-status-bahan').value;
  var filtered = _allBahanBaku.filter(function(b) {
    var matchK = !keyword || (b.nama + b.grup + b.keterangan).toLowerCase().indexOf(keyword) !== -1;
    var matchG = !grup || b.grup === grup;
    var matchS = !status || b.status === status;
    var matchStat = true;
    if (_bbStatFilter === 'lowstock') {
      matchStat = b.status === 'Aktif' && b.stok > 0 && b.stok <= b.stokMinimum && b.stokMinimum > 0;
    } else if (_bbStatFilter === 'habis') {
      matchStat = b.status === 'Aktif' && b.stok <= 0;
    }
    return matchK && matchG && matchS && matchStat;
  });
  renderBahanBakuTable(filtered);
}

// ===== TAMBAH / EDIT MODAL =====
function openTambahBahanBakuModal() {
  document.getElementById('bb-form-title').textContent = 'Tambah Bahan Baku';
  document.getElementById('bb-form').reset();
  document.getElementById('bb-id-edit').value = '';
  document.getElementById('bb-satuan').value = 'saset';
  var stokAwalGroup = document.getElementById('bb-stok-awal-group');
  if (stokAwalGroup) stokAwalGroup.style.display = '';
  var statusGroup = document.getElementById('bb-status-group');
  if (statusGroup) statusGroup.style.display = 'none';
  showModal('modal-bahan-baku');
}

function editBahanBakuForm(id) {
  var b = _allBahanBaku.find(function(x) { return x.id === id; });
  if (!b) return;
  document.getElementById('bb-form-title').textContent = 'Edit Bahan Baku';
  document.getElementById('bb-id-edit').value = b.id;
  document.getElementById('bb-nama').value = b.nama;
  document.getElementById('bb-grup').value = b.grup || '';
  document.getElementById('bb-satuan').value = b.satuan || 'saset';
  document.getElementById('bb-stok-minimum').value = b.stokMinimum || 0;
  document.getElementById('bb-keterangan').value = b.keterangan || '';
  // Tampilkan & set status saat edit
  var statusGroup = document.getElementById('bb-status-group');
  var statusSel = document.getElementById('bb-status');
  if (statusGroup) statusGroup.style.display = 'block';
  if (statusSel) statusSel.value = b.status || 'Aktif';
  var stokAwalGroup = document.getElementById('bb-stok-awal-group');
  if (stokAwalGroup) stokAwalGroup.style.display = 'none';
  showModal('modal-bahan-baku');
}

function saveBahanBaku() {
  var id = document.getElementById('bb-id-edit').value;
  var statusSel = document.getElementById('bb-status');
  var data = {
    nama: document.getElementById('bb-nama').value,
    grup: document.getElementById('bb-grup').value,
    satuan: document.getElementById('bb-satuan').value,
    stokMinimum: document.getElementById('bb-stok-minimum').value,
    keterangan: document.getElementById('bb-keterangan').value
  };
  if (id && statusSel) data.status = statusSel.value;
  if (!data.nama || !data.satuan) { showToast('Nama dan Satuan wajib diisi', 'warning'); return; }
  if (id) data.id = id;
  showLoading(true);
  var fn = id ? 'editBahanBaku' : 'tambahBahanBaku';
  if (!id) {
    data.stok = document.getElementById('bb-stok-awal') ? Number(document.getElementById('bb-stok-awal').value) || 0 : 0;
  }
  google.script.run
    .withSuccessHandler(function(res) {
      showLoading(false);
      closeModal('modal-bahan-baku');
      if (res.success) {
        showToast(res.message, 'success');
        loadBahanBakuPage();
        // Refresh bahan baku di APP state
        refreshBahanBakuState();
      } else {
        showToast(res.message, 'error');
      }
    })
    .withFailureHandler(function(e) { showLoading(false); showToast(e.message, 'error'); })
    [fn](data);
}

function confirmHapusBahan(id, nama) {
  if (!confirm('Nonaktifkan bahan baku "' + nama + '"?\nBahan baku tidak bisa digunakan jika dinonaktifkan.')) return;
  showLoading(true);
  google.script.run
    .withSuccessHandler(function(res) {
      showLoading(false);
      if (res.success) { showToast(res.message, 'success'); loadBahanBakuPage(); refreshBahanBakuState(); }
      else showToast(res.message, 'error');
    })
    .withFailureHandler(function(e) { showLoading(false); showToast(e.message, 'error'); })
    .hapusBahanBaku(id);
}

// ===== RESTOK MODAL =====
function openRestokModal(id, nama, satuan) {
  document.getElementById('restok-bahan-id').value = id;
  document.getElementById('restok-bahan-nama').textContent = nama;
  document.getElementById('restok-satuan-label').textContent = satuan;
  document.getElementById('restok-jumlah').value = '';
  document.getElementById('restok-keterangan').value = '';
  showModal('modal-restok-bahan');
}

function saveRestok() {
  var id = document.getElementById('restok-bahan-id').value;
  var jumlah = Number(document.getElementById('restok-jumlah').value);
  var ket = document.getElementById('restok-keterangan').value;
  if (!jumlah || jumlah <= 0) { showToast('Jumlah restok harus lebih dari 0', 'warning'); return; }
  showLoading(true);
  google.script.run
    .withSuccessHandler(function(res) {
      showLoading(false);
      closeModal('modal-restok-bahan');
      if (res.success) {
        showToast(res.message, 'success');
        loadBahanBakuPage();
        refreshBahanBakuState();
      } else {
        showToast(res.message, 'error');
      }
    })
    .withFailureHandler(function(e) { showLoading(false); showToast(e.message, 'error'); })
    .restokBahanBaku(id, jumlah, ket);
}

// ===== LOG BAHAN BAKU =====
function loadLogBahanBaku() {
  var tbody = document.getElementById('log-bahan-tbody');
  if (tbody) tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:20px;color:var(--text-muted)"><div class="spinner" style="margin:0 auto"></div></td></tr>';
  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        _allLogBahan = res.data || [];
        filterLogBahan();
      } else {
        if (tbody) tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:20px;color:var(--danger)">Gagal memuat log</td></tr>';
      }
    })
    .withFailureHandler(function(err) {
      if (tbody) tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:20px;color:var(--danger)">Error: ' + (err ? err.message : 'Gagal') + '</td></tr>';
    })
    .getLogBahanBaku(200);
}

function renderLogBahan(data) {
  var tbody = document.getElementById('log-bahan-tbody');
  var mobileList = document.getElementById('log-bahan-mobile-list');
  if (!tbody) return;
  if (!data || data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--text-muted)">Belum ada riwayat perubahan stok</td></tr>';
    if (mobileList) mobileList.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-muted)">Belum ada riwayat</div>';
    return;
  }
  var html = '';
  var mobileHtml = '';
  for (var i = 0; i < data.length; i++) {
    var log = data[i];
    var isPositive = log.perubahan >= 0;
    var perubahanText = (isPositive ? '+' : '') + log.perubahan;

    // Perubahan badge
    var perubahanBadge = isPositive
      ? '<span style="display:inline-flex;align-items:center;gap:2px;background:#d1fae5;color:#059669;font-weight:700;padding:3px 10px;border-radius:8px;font-size:12px"><span class="material-icons-round" style="font-size:11px">arrow_upward</span>' + perubahanText + '</span>'
      : '<span style="display:inline-flex;align-items:center;gap:2px;background:#fee2e2;color:#dc2626;font-weight:700;padding:3px 10px;border-radius:8px;font-size:12px"><span class="material-icons-round" style="font-size:11px">arrow_downward</span>' + perubahanText + '</span>';

    // Tipe badge - warna lebih jelas dan modern
    var tipeBadge;
    if (log.tipe === 'Masuk') {
      tipeBadge = '<span style="display:inline-flex;align-items:center;gap:4px;background:#d1fae5;color:#065f46;border:1px solid #6ee7b7;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700"><span class="material-icons-round" style="font-size:12px">move_to_inbox</span>Masuk</span>';
    } else if (log.tipe === 'Keluar') {
      tipeBadge = '<span style="display:inline-flex;align-items:center;gap:4px;background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700"><span class="material-icons-round" style="font-size:12px">outbox</span>Keluar</span>';
    } else {
      tipeBadge = '<span style="display:inline-flex;align-items:center;gap:4px;background:#fef3c7;color:#92400e;border:1px solid #fcd34d;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700"><span class="material-icons-round" style="font-size:12px">tune</span>Sesuaian</span>';
    }

    // Desktop row
    html += '<tr>' +
      '<td style="font-size:12px;white-space:nowrap;color:var(--text-muted)">' + log.tanggal + '</td>' +
      '<td><div style="font-weight:600;font-size:13px">' + log.namaBahan + '</div><div style="font-size:11px;color:var(--text-muted);margin-top:1px">' + log.idBahan + '</div></td>' +
      '<td style="text-align:center;color:var(--text-muted);font-size:13px">' + log.stokSebelum + '</td>' +
      '<td style="text-align:center">' + perubahanBadge + '</td>' +
      '<td style="text-align:center;font-weight:600;font-size:13px">' + log.stokSesudah + '</td>' +
      '<td>' + tipeBadge + '</td>' +
      '<td style="font-size:12px;color:var(--text-muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (log.keterangan || '—') + '</td>' +
      '<td style="font-size:12px;color:var(--text-muted)">' + (log.diupdateOleh || '—') + '</td>' +
      '</tr>';

    // Mobile card
    mobileHtml += '<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;border-left:3px solid ' + (isPositive ? '#059669' : '#dc2626') + '">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">' +
        '<div>' +
          '<div style="font-weight:700;font-size:13px">' + log.namaBahan + '</div>' +
          '<div style="font-size:11px;color:var(--text-muted)">' + log.tanggal + ' · ' + log.idBahan + '</div>' +
        '</div>' +
        '<div style="display:flex;gap:6px;align-items:center">' + tipeBadge + '</div>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px">' +
        '<div style="background:var(--bg);border-radius:8px;padding:8px;text-align:center">' +
          '<div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Sebelum</div>' +
          '<div style="font-weight:600;font-size:13px">' + log.stokSebelum + '</div>' +
        '</div>' +
        '<div style="background:var(--bg);border-radius:8px;padding:8px;text-align:center">' +
          '<div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Perubahan</div>' +
          '<div>' + perubahanBadge + '</div>' +
        '</div>' +
        '<div style="background:var(--bg);border-radius:8px;padding:8px;text-align:center">' +
          '<div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Sesudah</div>' +
          '<div style="font-weight:700;font-size:13px">' + log.stokSesudah + '</div>' +
        '</div>' +
      '</div>' +
      '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted)">' +
        '<span>' + (log.keterangan || '—') + '</span>' +
        '<span>Oleh: <strong style="color:var(--text)">' + (log.diupdateOleh || '—') + '</strong></span>' +
      '</div>' +
    '</div>';
  }
  tbody.innerHTML = html;
  if (mobileList) mobileList.innerHTML = mobileHtml;
}

function filterLogBahan() {
  var keyword = (document.getElementById('search-log-bahan').value || '').toLowerCase();
  var tipe = document.getElementById('filter-tipe-log').value;
  var dateFromVal = (document.getElementById('filter-log-date-from').value || '').trim();
  var dateToVal = (document.getElementById('filter-log-date-to').value || '').trim();
  var dateFrom = dateFromVal ? new Date(dateFromVal + 'T00:00:00') : null;
  var dateTo = dateToVal ? new Date(dateToVal + 'T23:59:59') : null;

  if (dateFrom && isNaN(dateFrom.getTime())) dateFrom = null;
  if (dateTo && isNaN(dateTo.getTime())) dateTo = null;

  var filtered = _allLogBahan.filter(function(log) {
    var matchK = !keyword || (log.namaBahan + log.keterangan + log.idTransaksi).toLowerCase().indexOf(keyword) !== -1;
    var matchT = !tipe || log.tipe === tipe;
    var matchDate = true;
    if (dateFrom || dateTo) {
      var logDate = parseLogTanggal(log.tanggal);
      if (!logDate) {
        matchDate = false;
      } else {
        if (dateFrom && logDate < dateFrom) matchDate = false;
        if (dateTo && logDate > dateTo) matchDate = false;
      }
    }
    return matchK && matchT && matchDate;
  });
  renderLogBahan(filtered);
}

function parseLogTanggal(value) {
  if (!value) return null;
  var raw = String(value).trim();
  var datePart = raw.split(' ')[0];
  var timePart = raw.split(' ')[1] || '00:00';
  var d = datePart.split('/');
  var t = timePart.split(':');
  if (d.length !== 3) return null;
  var day = Number(d[0]);
  var month = Number(d[1]) - 1;
  var year = Number(d[2]);
  var hour = Number(t[0] || 0);
  var minute = Number(t[1] || 0);
  var parsed = new Date(year, month, day, hour, minute, 0, 0);
  return isNaN(parsed.getTime()) ? null : parsed;
}
</script>
