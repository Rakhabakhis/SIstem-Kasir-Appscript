    } else {
      google.script.run.withSuccessHandler(function (res) {
        showLoading(false); closeModal('modal-kasir');
        if (res.success) { showToast(res.message, 'success'); loadKasirTable(); }
        else showToast(res.message, 'error');
      }).withFailureHandler(function (e) { showLoading(false); showToast(e.message, 'error'); }).tambahKasir(data);
    }
  }

  function confirmHapusKasir(id, nama) {
    if (confirm('Nonaktifkan kasir "' + nama + '"?')) {
      showLoading(true);
      google.script.run.withSuccessHandler(function (res) {
        showLoading(false);
        if (res.success) { showToast(res.message, 'success'); loadKasirTable(); }
        else showToast(res.message, 'error');
      }).hapusKasir(id);
    }
  }

  // ==================== MODAL HELPERS ====================
  function showModal(id) { document.getElementById(id).classList.add('active'); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }

  // ==================== TOAST ====================
  function showToast(message, type) {
    type = type || 'info';
    var container = document.getElementById('toast-container');
    if (!container) return;
    var icons = { success: 'check_circle', error: 'error', warning: 'warning', info: 'info' };
    var toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.innerHTML = '<span class="material-icons-round" style="font-size:20px">' + icons[type] + '</span><span>' + message + '</span>';
    container.appendChild(toast);
    setTimeout(function () { toast.style.opacity = '0'; toast.style.transform = 'translateX(100%)'; setTimeout(function () { toast.remove(); }, 300); }, 3000);
  }

  // ==================== LOADING ====================
  function showLoading(show) {
    var loader = document.getElementById('loading-overlay');
    if (loader) loader.style.display = show ? 'flex' : 'none';
  }

  // ==================== FORMAT HELPERS ====================
  function fmtRp(n) {
    n = parseInt(n) || 0;
    return 'Rp ' + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }
  function fmtDateISO(d) {
    var y = d.getFullYear();
    var m = ('0' + (d.getMonth() + 1)).slice(-2);
    var dd = ('0' + d.getDate()).slice(-2);
    return y + '-' + m + '-' + dd;
  }

  // ==================== CATATAN ITEM ====================
  function toggleCatatan(cartKey) {
    var input = document.getElementById('catatan-' + cartKey);
    if (!input) return;
    var isHidden = input.style.display === 'none' || input.style.display === '';
    if (isHidden) {
      input.style.display = 'block';
      input.focus();
      input.select();
    } else {
      input.style.display = 'none';
    }
  }

  function saveCatatan(cartKey, val) {
    var item = APP.cart.find(function(c) { return (c.cartKey || c.id) === cartKey; });
    if (item) {
      item.catatan = (val || '').trim();
      updateOrderPanel();
    }
  }

  // ==================== VARIANT PICKER ====================
  function openVariantPicker(productId) {
    var grupList = (APP.resepPilihan[productId] || []).slice();
    APP.variantPickerState = { productId: productId, pending: grupList, selected: [] };
    renderVariantPickerStep();
    showModal('modal-variant-picker');
  }

  function renderVariantPickerStep() {
    var state = APP.variantPickerState;
    if (!state || state.pending.length === 0) return;
    var current = state.pending[0];
    var grup = current.grupPilihan;
    var titleEl = document.getElementById('variant-picker-title');
    var optionsEl = document.getElementById('variant-picker-options');
    var stepEl = document.getElementById('variant-picker-step');
    var total = state.selected.length + state.pending.length;
    var step = state.selected.length + 1;
    if (titleEl) titleEl.textContent = 'Pilih ' + grup;
    if (stepEl) stepEl.textContent = total > 1 ? 'Langkah ' + step + ' dari ' + total : '';
    var allOptions = APP.bahanBaku.filter(function (b) { return b.grup === grup; });
    if (allOptions.length === 0) {
      if (optionsEl) optionsEl.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted)">Tidak ada pilihan tersedia</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < allOptions.length; i++) {
      var b = allOptions[i];
      var isHabis = b.stok <= 0;
      html += '<button class="variant-option' + (isHabis ? ' variant-option-habis' : '') + '"' +
        (isHabis ? ' disabled' : ' onclick="selectVariantOption(\'' + b.id + '\',\'' + b.nama.replace(/'/g, '') + '\',\'' + b.satuan.replace(/'/g, '') + '\')"') + '>' +
        '<span class="variant-option-name">' + b.nama + '</span>' +
        '<span class="variant-option-stock' + (isHabis ? ' habis' : '') + '">' + (isHabis ? 'Habis' : b.stok + ' ' + b.satuan) + '</span>' +
        '</button>';
    }
    if (optionsEl) optionsEl.innerHTML = html;
  }

  function selectVariantOption(idBahan, namaBahan, satuan) {
    var state = APP.variantPickerState;
    if (!state) return;
    var current = state.pending.shift();
    state.selected.push({
      grupPilihan: current.grupPilihan,
      idBahan: idBahan,
      namaBahan: namaBahan,
      jumlahPerPorsi: current.jumlahPerPorsi,
      satuan: current.satuan || satuan
    });
    if (state.pending.length > 0) {
      renderVariantPickerStep();
    } else {
      closeModal('modal-variant-picker');
      addToCartDirect(state.productId, state.selected);
      APP.variantPickerState = null;
    }
  }

  // ==================== BAHAN BAKU DATALIST ====================
  function populateGrupDatalist() {
    var dl = document.getElementById('bb-grup-list');
    if (!dl) return;
    dl.innerHTML = '';
    (APP.grupList || []).forEach(function(g) {
      var opt = document.createElement('option');
      opt.value = g;
      dl.appendChild(opt);
    });
  }

  // ==================== RESEP EDITOR (in produk form) ====================

  function filterResepBahan() {
    var keyword = (document.getElementById('resep-search-bahan').value || '').toLowerCase();
    var dropdown = document.getElementById('resep-bahan-dropdown');
    if (!dropdown) return;
    if (!keyword) { dropdown.style.display = 'none'; return; }

    var filtered = APP.bahanBaku.filter(function(b) {
      return (b.nama + ' ' + b.grup).toLowerCase().indexOf(keyword) !== -1;
    });

    // Exclude already added
    var addedIds = (APP.resepEditTemp || []).map(function(r) { return r.idBahan; });
    filtered = filtered.filter(function(b) { return addedIds.indexOf(b.id) === -1; });

    if (filtered.length === 0) {
      dropdown.style.display = 'none';
      return;
    }

    var html = '';
    for (var i = 0; i < filtered.length; i++) {
      var b = filtered[i];
      var grupBadge = b.grup ? '<span style="font-size:10px;background:var(--primary-light,#e0f2fe);color:var(--primary);padding:1px 6px;border-radius:8px;margin-left:4px">' + b.grup + '</span>' : '';
      html += '<div style="padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;background:var(--bg-card);" ' +
        'onclick="addBahanToResep(\'' + b.id + '\',\'' + b.nama.replace(/'/g, '') + '\',\'' + b.satuan + '\')" ' +
        'onmouseover="this.style.background=\'var(--bg)\'" onmouseout="this.style.background=\'var(--bg-card)\'">' +
        '<span>' + b.nama + grupBadge + '</span>' +
        '<span style="font-size:11px;color:var(--text-muted)">' + b.stok + ' ' + b.satuan + '</span>' +
        '</div>';
    }
    dropdown.innerHTML = html;
    dropdown.style.display = 'block';
  }

  // Close dropdown when clicking outside
  document.addEventListener('click', function(e) {
    var searchEl = document.getElementById('resep-search-bahan');
    var dropdown = document.getElementById('resep-bahan-dropdown');
    if (searchEl && dropdown && !searchEl.contains(e.target) && !dropdown.contains(e.target)) {
      dropdown.style.display = 'none';
    }
  });

  function addBahanToResep(idBahan, namaBahan, satuan) {
    if ((APP.resepEditTemp || []).find(function (r) { return r.idBahan === idBahan; })) {
      showToast('Bahan sudah ada dalam resep', 'warning'); return;
    }
    if (!APP.resepEditTemp) APP.resepEditTemp = [];
    APP.resepEditTemp.push({ tipeBahan: 'Tetap', idBahan: idBahan, namaBahan: namaBahan, jumlahPerPorsi: 1, satuan: satuan, grupPilihan: '' });
    renderResepList();
    var searchEl = document.getElementById('resep-search-bahan');
    var dropdown = document.getElementById('resep-bahan-dropdown');
    if (searchEl) searchEl.value = '';
    if (dropdown) dropdown.style.display = 'none';
  }

  function addGrupPilihanToResep() {
    var grupInput = document.getElementById('resep-pilihan-grup');
    var qtyInput = document.getElementById('resep-pilihan-qty');
    var grup = grupInput ? grupInput.value.trim() : '';
    var qty = qtyInput ? (Number(qtyInput.value) || 1) : 1;
    if (!grup) { showToast('Pilih grup/brand terlebih dahulu', 'warning'); return; }
    var alreadyExists = (APP.resepEditTemp || []).find(function (r) {
      return r.tipeBahan === 'Pilihan' && r.grupPilihan === grup;
    });
    if (alreadyExists) { showToast('Grup "' + grup + '" sudah ada dalam resep', 'warning'); return; }
    var firstBahan = APP.bahanBaku.find(function (b) { return b.grup === grup; });
    var satuanGrup = firstBahan ? firstBahan.satuan : '';
    if (!APP.resepEditTemp) APP.resepEditTemp = [];
    APP.resepEditTemp.push({ tipeBahan: 'Pilihan', grupPilihan: grup, idBahan: '', namaBahan: '', jumlahPerPorsi: qty, satuan: satuanGrup });
    renderResepList();
    if (grupInput) grupInput.value = '';
    if (qtyInput) qtyInput.value = '1';
  }

  function removeBahanFromResep(key) {
    APP.resepEditTemp = (APP.resepEditTemp || []).filter(function (r) {
      return (r.tipeBahan === 'Pilihan' ? 'PILIHAN_' + r.grupPilihan : r.idBahan) !== key;
    });
    renderResepList();
  }

  function updateResepQty(key, value) {
    var item = (APP.resepEditTemp || []).find(function (r) {
      return (r.tipeBahan === 'Pilihan' ? 'PILIHAN_' + r.grupPilihan : r.idBahan) === key;
    });
    if (item) item.jumlahPerPorsi = Number(value) || 1;
    updateResepStokPreview();
  }

  function renderResepList() {
    var container = document.getElementById('resep-list');
    if (!container) return;
    var items = APP.resepEditTemp || [];
    if (items.length === 0) {
      container.innerHTML = '<div style="text-align:center;padding:12px;color:var(--text-muted);font-size:12px;background:var(--bg);border-radius:var(--radius-sm)">Belum ada bahan baku. Produk tidak bisa dijual sampai resep diisi.</div>';
      var preview = document.getElementById('resep-stok-preview');
      if (preview) preview.style.display = 'none';
      return;
    }
    var html = '<div style="border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden">';
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      var tipe = item.tipeBahan || 'Tetap';
      var key = tipe === 'Pilihan' ? 'PILIHAN_' + item.grupPilihan : item.idBahan;
      var bg = i % 2 === 0 ? '' : 'background:var(--bg)';
      var tipeBadge = tipe === 'Pilihan'
        ? '<span style="font-size:10px;background:#fef9c3;color:#92400e;padding:1px 6px;border-radius:8px;margin-right:4px;font-weight:600">Pilihan</span>'
        : '<span style="font-size:10px;background:#dcfce7;color:#166534;padding:1px 6px;border-radius:8px;margin-right:4px;font-weight:600">Tetap</span>';
      var label = tipe === 'Pilihan'
        ? 'Pilih dari Grup: <strong>' + item.grupPilihan + '</strong>'
        : item.namaBahan;
      html += '<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;' + bg + '">' +
        '<span class="material-icons-round" style="font-size:16px;color:var(--text-muted)">' + (tipe === 'Pilihan' ? 'tune' : 'kitchen') + '</span>' +
        '<span style="flex:1;font-size:13px">' + tipeBadge + label + '</span>' +
        '<div style="display:flex;align-items:center;gap:4px">' +
        '<input type="number" min="0.1" step="0.1" value="' + item.jumlahPerPorsi + '" ' +
        'style="width:70px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;text-align:center" ' +
        'onchange="updateResepQty(\'' + key + '\', this.value)">' +
        '<span style="font-size:12px;color:var(--text-muted);min-width:40px">' + (item.satuan || '') + '</span>' +
        '</div>' +
        '<button onclick="removeBahanFromResep(\'' + key + '\')" style="background:none;border:none;cursor:pointer;color:var(--danger);padding:2px">' +
        '<span class="material-icons-round" style="font-size:18px">delete</span>' +
        '</button>' +
        '</div>';
    }
    html += '</div>';
    container.innerHTML = html;
    updateResepStokPreview();
  }

  function updateResepStokPreview() {
    var preview = document.getElementById('resep-stok-preview');
    var previewText = document.getElementById('resep-stok-preview-text');
    if (!preview || !previewText) return;
    var items = APP.resepEditTemp || [];
    if (items.length === 0) { preview.style.display = 'none'; return; }

    var minPorsi = Infinity;
    var bottleneck = '';
    for (var i = 0; i < items.length; i++) {
      var tipe = items[i].tipeBahan || 'Tetap';
      var porsi;
      if (tipe === 'Pilihan') {
        var totalGrup = APP.bahanBaku.filter(function (x) { return x.grup === items[i].grupPilihan; })
          .reduce(function (sum, x) { return sum + x.stok; }, 0);
        porsi = Math.floor(totalGrup / (items[i].jumlahPerPorsi || 1));
        if (porsi < minPorsi) { minPorsi = porsi; bottleneck = 'Grup ' + items[i].grupPilihan; }
      } else {
        var b = APP.bahanBaku.find(function (x) { return x.id === items[i].idBahan; });
        if (!b) continue;
        porsi = Math.floor(b.stok / (items[i].jumlahPerPorsi || 1));
        if (porsi < minPorsi) { minPorsi = porsi; bottleneck = b.nama; }
      }
    }
    if (minPorsi === Infinity) minPorsi = 0;
    previewText.textContent = '📦 Stok tersedia: ' + minPorsi + ' porsi' + (bottleneck ? ' (dibatasi oleh: ' + bottleneck + ')' : '');
    preview.style.display = 'block';
  }

  // ==================== INIT ====================
  document.addEventListener('DOMContentLoaded', initLogin);
</script>
