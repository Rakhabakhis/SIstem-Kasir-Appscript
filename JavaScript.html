<script>
  /* =====================================================
     JAVASCRIPT - Shared Utilities & App Logic
     Sistem Kasir (POS) - Google Apps Script
     ===================================================== */

  // ==================== STATE ====================
  var APP = {
    produk: [],
    cart: [],
    settings: {},
    kasirList: [],
    kategoriAktif: 'Semua Produk',
    halamanAktif: 'kasir',
    loggedInKasir: null,
    lastTransaksi: null,
    bahanBaku: [],
    grupList: [],
    resepEditTemp: [],
    resepPilihan: {},
    variantPickerState: null,
    currentPayStep: 'method',
    selectedPayment: 'Cash',
    selectedPesananId: null,
    selectedPesananTotal: 0,
    selectedBayarPesananMethod: 'Cash'
  };

  // ==================== LOGIN ====================
  function initLogin() {
    var sel = document.getElementById('login-nama');

    // Fallback ke Admin jika timeout 8 detik
    var timeoutId = setTimeout(function () {
      if (sel.innerHTML.indexOf('Memuat') !== -1) {
        sel.innerHTML = '<option value="Admin">Admin</option>';
      }
    }, 8000);

    google.script.run
      .withSuccessHandler(function (res) {
        clearTimeout(timeoutId);
        // getKasirAktif mengembalikan array langsung di res.data
        if (res && res.success && res.data && res.data.length > 0) {
          var opts = '<option value="">-- Pilih Kasir --</option>';
          for (var i = 0; i < res.data.length; i++) {
            opts += '<option value="' + res.data[i].nama + '">' + res.data[i].nama + '</option>';
          }
          sel.innerHTML = opts;
        } else {
          sel.innerHTML = '<option value="Admin">Admin</option>';
        }
      })
      .withFailureHandler(function (err) {
        clearTimeout(timeoutId);
        sel.innerHTML = '<option value="Admin">Admin</option>';
        console.warn('initLogin error:', err ? err.message : 'unknown');
      })
      .getKasirAktif();
  }

  function doLogin() {
    var nama = document.getElementById('login-nama').value;
    var pin = document.getElementById('login-pin').value;
    var errEl = document.getElementById('login-error');

    if (!nama) { errEl.textContent = 'Pilih nama kasir'; errEl.style.display = 'block'; return; }
    if (!pin) { errEl.textContent = 'Masukkan PIN'; errEl.style.display = 'block'; return; }

    errEl.style.display = 'none';
    showLoading(true);

    google.script.run
      .withSuccessHandler(function (res) {
        showLoading(false);
        if (res.success) {
          APP.loggedInKasir = res.data;
          document.getElementById('login-screen').classList.add('hidden');
          document.getElementById('app-container').style.display = 'flex';
          document.getElementById('user-name').textContent = res.data.nama;
          document.getElementById('avatar-initial').textContent = res.data.nama.charAt(0).toUpperCase();
          // Show mobile order button
          var mob = document.getElementById('mobile-order-btn');
          if (mob) mob.style.display = '';
          initApp();
          showToast(res.message, 'success');
        } else {
          errEl.textContent = res.message;
          errEl.style.display = 'block';
        }
      })
      .withFailureHandler(function (err) {
        showLoading(false);
        errEl.textContent = 'Error: ' + err.message;
        errEl.style.display = 'block';
      })
      .loginKasir(nama, pin);
  }

  function doLogout() {
    if (!confirm('Yakin ingin logout?')) return;
    APP.loggedInKasir = null;
    APP.cart = [];
    document.getElementById('app-container').style.display = 'none';
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('login-pin').value = '';
    var mob = document.getElementById('mobile-order-btn');
    if (mob) mob.style.display = 'none';
  }

  // ==================== INITIALIZATION ====================
  function initApp() {
    showLoading(true);
    google.script.run
      .withSuccessHandler(function (res) {
        showLoading(false);
        if (res.success) {
          APP.produk = res.data.produk;
          APP.settings = res.data.settings;
          APP.kasirList = res.data.kasirList || [];
          APP.kategoriList = res.data.kategori || ['Semua Produk'];
          APP.bahanBaku = res.data.bahanBaku || [];
          APP.grupList = res.data.grupList || [];
          APP.resepPilihan = res.data.resepPilihan || {};
          var pendingCount = res.data.pesananPendingCount || 0;
          var navBadge = document.getElementById('nav-pesanan-badge');
          if (navBadge) {
            navBadge.textContent = pendingCount;
            navBadge.style.display = pendingCount > 0 ? '' : 'none';
          }
          renderCategoryTabs(APP.kategoriList);
          renderProdukGrid(APP.produk);
          updateOrderPanel();
          updateSidebarStoreName();
          populateGrupDatalist();
        } else {
          showToast(res.message, 'error');
        }
      })
      .withFailureHandler(function (err) {
        showLoading(false);
        showToast('Gagal memuat data: ' + err.message, 'error');
      })
      .getInitData();
  }

  // ==================== SIDEBAR STORE NAME ====================
  function updateSidebarStoreName() {
    var nama = APP.settings.nama_toko || 'Sistem Kasir';
    var titleEl = document.getElementById('sidebar-store-name');
    var logoEl = document.getElementById('sidebar-logo-initial');
    if (titleEl) titleEl.textContent = nama;
    if (logoEl) logoEl.textContent = nama.charAt(0).toUpperCase();
  }

  // ==================== NAVIGATION ====================
  function navigateTo(page) {
    APP.halamanAktif = page;
    document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('active'); });
    var target = document.getElementById('page-' + page);
    if (target) target.classList.add('active');
    document.querySelectorAll('.nav-item').forEach(function (n) { n.classList.remove('active'); });
    var navItem = document.querySelector('.nav-item[data-page="' + page + '"]');
    if (navItem) navItem.classList.add('active');
    closeSidebar();
    if (page === 'pesanan') loadDaftarPesanan();
    if (page === 'produk') loadProdukAdmin();
    if (page === 'kategori') loadKategoriPage();
    if (page === 'bahan-baku') loadBahanBakuPage();
    if (page === 'laporan') loadLaporan();
    if (page === 'riwayat') loadRiwayat();
    if (page === 'pengaturan') loadPengaturan();
  }

  // ==================== SIDEBAR ====================
  function toggleSidebar() {
    document.querySelector('.sidebar').classList.toggle('open');
    var overlay = document.querySelector('.sidebar-overlay');
    if (overlay) overlay.classList.toggle('active');
  }
  function closeSidebar() {
    document.querySelector('.sidebar').classList.remove('open');
    var overlay = document.querySelector('.sidebar-overlay');
    if (overlay) overlay.classList.remove('active');
  }

  // ==================== VIEW MODE ====================
  APP.viewMode = 'grid'; // 'grid' atau 'list'

  function setViewMode(mode) {
    APP.viewMode = mode;
    var grid = document.getElementById('product-grid');
    var btnGrid = document.getElementById('btn-view-grid');
    var btnList = document.getElementById('btn-view-list');

    if (mode === 'list') {
      if (grid) grid.classList.add('list-view');
      if (btnGrid) btnGrid.classList.remove('active');
      if (btnList) btnList.classList.add('active');
    } else {
      if (grid) grid.classList.remove('list-view');
      if (btnGrid) btnGrid.classList.add('active');
      if (btnList) btnList.classList.remove('active');
    }

    // Re-render supaya HTML kartu sesuai mode
    var currentProducts = APP.kategoriAktif === 'Semua Produk'
      ? APP.produk
      : APP.produk.filter(function (p) { return p.kategori === APP.kategoriAktif; });
    renderProdukGrid(currentProducts);
  }

  // ==================== PRODUCT GRID ====================
  function renderProdukGrid(products) {
    var grid = document.getElementById('product-grid');
    if (!grid) return;

    // Jaga class list-view sesuai mode saat ini
    if (APP.viewMode === 'list') {
      grid.classList.add('list-view');
    } else {
      grid.classList.remove('list-view');
    }

    if (!products || products.length === 0) {
      grid.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">Tidak ada produk ditemukan</div>';
      return;
    }

    var html = '';
    for (var i = 0; i < products.length; i++) {
      var p = products[i];
      var stokTampil = p.stokDariBahan !== undefined ? p.stokDariBahan : 0;
      var stockClass = stokTampil <= 5 ? 'low' : '';
      var stockText = stokTampil <= 0 ? 'Habis' : 'Stok: ' + stokTampil;
      var isHabis = stokTampil <= 0;
      var disabledStyle = isHabis ? 'opacity:0.55;pointer-events:none;' : '';
      var hasPilihan = APP.resepPilihan[p.id] && APP.resepPilihan[p.id].length > 0;
      var varianIndicator = hasPilihan ? '<span style="font-size:10px;background:var(--primary-light,#e0f2fe);color:var(--primary);padding:2px 6px;border-radius:8px;margin-left:4px;font-weight:600">Pilih Rasa</span>' : '';

      if (APP.viewMode === 'list') {
        html += '<div class="product-card" onclick="' + (isHabis ? '' : "addToCart('" + p.id + "')") + '" style="' + disabledStyle + '">' +
          '<img class="product-card-img" src="' + (p.gambar || '') + '" alt="' + p.nama + '" onerror="this.src=\'https://placehold.co/80/e2e8f0/94a3b8?text=-\'">' +
          '<div class="product-card-body">' +
          '<div class="product-name">' + p.nama + varianIndicator + '</div>' +
          '<div class="product-desc">' + (p.deskripsi || '') + '</div>' +
          '<div class="product-price-row">' +
          '<span class="product-price">' + fmtRp(p.harga) + '</span>' +
          '<button class="btn-add-cart" onclick="event.stopPropagation();' + (isHabis ? '' : "addToCart('" + p.id + "')") + '" ' + (isHabis ? 'disabled' : '') + '><span class="material-icons-round">' + (hasPilihan ? 'tune' : 'add') + '</span></button>' +
          '</div></div>' +
          '<div class="stock-badge ' + stockClass + '">' + stockText + '</div>' +
          '</div>';
      } else {
        html += '<div class="product-card" onclick="' + (isHabis ? '' : "addToCart('" + p.id + "')") + '" style="' + disabledStyle + '">' +
          '<div class="stock-badge ' + stockClass + '">' + stockText + '</div>' +
          '<img class="product-card-img" src="' + (p.gambar || '') + '" alt="' + p.nama + '" onerror="this.src=\'https://placehold.co/300x200/e2e8f0/94a3b8?text=No+Image\'">' +
          '<div class="product-card-body">' +
          '<div class="product-name">' + p.nama + '</div>' +
          (hasPilihan ? '<div style="font-size:10px;color:var(--primary);margin-bottom:2px"><span class="material-icons-round" style="font-size:11px;vertical-align:middle">tune</span> Pilih Rasa</div>' : '<div class="product-desc">' + (p.deskripsi || '') + '</div>') +
          '<div class="product-price-row">' +
          '<span class="product-price">' + fmtRp(p.harga) + '</span>' +
          '<button class="btn-add-cart" onclick="event.stopPropagation();' + (isHabis ? '' : "addToCart('" + p.id + "')") + '" ' + (isHabis ? 'disabled' : '') + '><span class="material-icons-round">' + (hasPilihan ? 'tune' : 'add') + '</span></button>' +
          '</div></div></div>';
      }
    }
    grid.innerHTML = html;
  }

  function renderCategoryTabs(kategoriList) {
    var container = document.getElementById('category-tabs-container');
    if (!container) return;
    var html = '';
    for (var i = 0; i < kategoriList.length; i++) {
      var k = kategoriList[i];
      var isActive = (APP.kategoriAktif === k) || (i === 0 && !APP.kategoriAktif);
      html += '<button class="cat-tab' + (isActive ? ' active' : '') + '" onclick="filterByKategori(\'' + k.replace(/'/g, "\\'") + '\', this)">' + k + '</button>';
    }
    container.innerHTML = html;
  }

  function filterByKategori(kategori, btn) {
    APP.kategoriAktif = kategori;
    document.querySelectorAll('.cat-tab').forEach(function (t) { t.classList.remove('active'); });
    if (btn) btn.classList.add('active');
    else {
      // Find and activate the matching tab if no btn provided
      var tabs = document.querySelectorAll('.cat-tab');
      tabs.forEach(function (t) {
        if (t.textContent.trim() === kategori) t.classList.add('active');
      });
    }
    if (kategori === 'Semua Produk') {
      renderProdukGrid(APP.produk);
    } else {
      var filtered = APP.produk.filter(function (p) { return p.kategori === kategori; });
      renderProdukGrid(filtered);
    }
  }

  function searchProducts() {
    var keyword = (document.getElementById('search-product') || document.getElementById('sidebar-search') || {}).value || '';
    keyword = keyword.toLowerCase();
    var filtered = APP.produk.filter(function (p) {
      return p.nama.toLowerCase().indexOf(keyword) !== -1 || (p.deskripsi && p.deskripsi.toLowerCase().indexOf(keyword) !== -1);
    });
    if (APP.kategoriAktif !== 'Semua Produk') {
      filtered = filtered.filter(function (p) { return p.kategori === APP.kategoriAktif; });
    }
    renderProdukGrid(filtered);
  }

  // ==================== CART ====================
  function addToCart(productId) {
    var product = APP.produk.find(function (p) { return p.id === productId; });
    if (!product) return;
    var stokEfektif = product.stokDariBahan !== undefined ? product.stokDariBahan : 0;
    if (stokEfektif <= 0) { showToast('Stok habis!', 'warning'); return; }

    var grupPilihan = APP.resepPilihan[productId];
    if (grupPilihan && grupPilihan.length > 0) {
      openVariantPicker(productId);
      return;
    }
    addToCartDirect(productId, []);
  }

  function addToCartDirect(productId, pilihanVarian) {
    var product = APP.produk.find(function (p) { return p.id === productId; });
    if (!product) return;
    var stokEfektif = product.stokDariBahan !== undefined ? product.stokDariBahan : 0;

    var cartKey = productId;
    if (pilihanVarian && pilihanVarian.length > 0) {
      cartKey = productId + '_' + pilihanVarian.map(function (v) { return v.idBahan; }).join('_');
    }

    var cartItem = APP.cart.find(function (c) { return (c.cartKey || c.id) === cartKey; });
    if (cartItem) {
      if (cartItem.jumlah >= stokEfektif) { showToast('Stok tidak cukup', 'warning'); return; }
      cartItem.jumlah++;
    } else {
      APP.cart.push({
        id: product.id,
        cartKey: cartKey,
        nama: product.nama,
        harga: product.harga,
        jumlah: 1,
        gambar: product.gambar,
        catatan: '',
        pilihanVarian: pilihanVarian || []
      });
    }
    updateOrderPanel();
    var varLabel = pilihanVarian && pilihanVarian.length > 0
      ? ' (' + pilihanVarian.map(function (v) { return v.namaBahan; }).join(', ') + ')' : '';
    showToast(product.nama + varLabel + ' ditambahkan', 'success');
  }

  function updateQty(cartKey, delta) {
    var cartItem = APP.cart.find(function (c) { return (c.cartKey || c.id) === cartKey; });
    if (!cartItem) return;
    var product = APP.produk.find(function (p) { return p.id === cartItem.id; });
    cartItem.jumlah += delta;
    if (cartItem.jumlah <= 0) { removeFromCart(cartKey); return; }
    if (product) {
      var stokEfektif = product.stokDariBahan !== undefined ? product.stokDariBahan : 0;
      if (cartItem.jumlah > stokEfektif) { cartItem.jumlah = stokEfektif; showToast('Maksimum stok: ' + stokEfektif, 'warning'); }
    }
    updateOrderPanel();
  }

  function removeFromCart(cartKey) {
    APP.cart = APP.cart.filter(function (c) { return (c.cartKey || c.id) !== cartKey; });
    updateOrderPanel();
  }

  function clearCart() {
    APP.cart = [];
    updateOrderPanel();
  }

  function updateOrderPanel() {
    var container = document.getElementById('order-items-list');
    var summaryEl = document.getElementById('order-summary');
    var emptyEl = document.getElementById('order-empty');
    var countEl = document.getElementById('cart-count');
    if (!container) return;

    var totalItems = APP.cart.reduce(function (sum, c) { return sum + c.jumlah; }, 0);
    if (countEl) { countEl.textContent = totalItems; countEl.style.display = totalItems > 0 ? 'flex' : 'none'; }

    // Update mobile FAB badge
    var fabBadge = document.getElementById('mobile-cart-badge');
    if (fabBadge) {
      if (totalItems > 0) {
        fabBadge.textContent = totalItems;
        fabBadge.style.display = 'flex';
      } else {
        fabBadge.style.display = 'none';
      }
    }


    if (APP.cart.length === 0) {
      container.innerHTML = '';
      if (emptyEl) emptyEl.style.display = 'flex';
      if (summaryEl) summaryEl.innerHTML = '';
      return;
    }
    if (emptyEl) emptyEl.style.display = 'none';

    var html = '';
    var subtotal = 0;
    for (var i = 0; i < APP.cart.length; i++) {
      var item = APP.cart[i];
      var ck = item.cartKey || item.id;
      var itemTotal = item.harga * item.jumlah;
      subtotal += itemTotal;
      var varianChip = '';
      if (item.pilihanVarian && item.pilihanVarian.length > 0) {
        varianChip = '<div style="margin-top:2px;display:flex;flex-wrap:wrap;gap:3px;">' +
          item.pilihanVarian.map(function (v) {
            return '<span style="font-size:10px;background:var(--primary-light,#e0f2fe);color:var(--primary);padding:1px 6px;border-radius:8px;font-weight:600">' + v.namaBahan + '</span>';
          }).join('') + '</div>';
      }
      var catatanDisplay = item.catatan
        ? '<span class="catatan-text" onclick="toggleCatatan(\'' + ck + '\')" title="Klik untuk edit">' + item.catatan + '</span>'
        : '<span class="add-catatan-link" onclick="toggleCatatan(\'' + ck + '\')">Tambahkan catatan</span>';

      html += '<div class="order-item">' +
        '<img class="order-item-img" src="' + (item.gambar || '') + '" onerror="this.src=\'https://placehold.co/80/e2e8f0/94a3b8?text=-\'">' +
        '<div class="order-item-info">' +
        '<div class="order-item-name">' + item.nama + '</div>' +
        varianChip +
        '<div class="order-item-price">' + fmtRp(item.harga) + '</div>' +
        '<div class="order-item-actions">' +
        '<button class="qty-btn" onclick="updateQty(\'' + ck + '\',-1)">−</button>' +
        '<span class="qty-value">' + item.jumlah + '</span>' +
        '<button class="qty-btn" onclick="updateQty(\'' + ck + '\',1)">+</button>' +
        '</div>' +
        '<div class="item-catatan-row">' + catatanDisplay +
        '<input type="text" id="catatan-' + ck + '" class="catatan-input" value="' + (item.catatan || '').replace(/"/g, '&quot;') + '" placeholder="Catatan untuk item ini..." style="display:none" ' +
        'onblur="saveCatatan(\'' + ck + '\',this.value)" onkeydown="if(event.key===\'Enter\'){saveCatatan(\'' + ck + '\',this.value);this.blur();}">' +
        '</div>' +
        '</div>' +
        '<span class="material-icons-round order-item-delete" onclick="removeFromCart(\'' + ck + '\')">delete</span>' +
        '</div>';
    }
    container.innerHTML = html;

    var pajakPersen = APP.settings.pajak_aktif === 'Ya' ? (Number(APP.settings.pajak_persen) || 0) : 0;
    var pajak = Math.round(subtotal * pajakPersen / 100);
    var diskonEl = document.getElementById('input-diskon');
    var diskon = diskonEl ? (Number(diskonEl.value) || 0) : 0;
    var total = subtotal + pajak - diskon;

    if (summaryEl) {
      summaryEl.innerHTML =
        '<div class="summary-row"><span>Subtotal (' + totalItems + ' item)</span><span>' + fmtRp(subtotal) + '</span></div>' +
        (pajakPersen > 0 ? '<div class="summary-row"><span>Pajak (' + pajakPersen + '%)</span><span>' + fmtRp(pajak) + '</span></div>' : '') +
        '<div class="summary-row"><span>Diskon</span><span>- <input type="number" id="input-diskon" class="discount-input" value="' + diskon + '" min="0" onchange="updateOrderPanel()"></span></div>' +
        '<div class="summary-row total"><span>Total</span><span>' + fmtRp(total) + '</span></div>';
    }
  }

  function getCartTotal() {
    var subtotal = APP.cart.reduce(function (s, c) { return s + c.harga * c.jumlah; }, 0);
    var pajakPersen = APP.settings.pajak_aktif === 'Ya' ? (Number(APP.settings.pajak_persen) || 0) : 0;
    var pajak = Math.round(subtotal * pajakPersen / 100);
    var diskonEl = document.getElementById('input-diskon');
    var diskon = diskonEl ? (Number(diskonEl.value) || 0) : 0;
    return { subtotal: subtotal, pajak: pajak, pajakPersen: pajakPersen, diskon: diskon, total: subtotal + pajak - diskon };
  }

  // ==================== ORDER PANEL MOBILE ====================
  function toggleOrderPanel() {
    var panel = document.querySelector('.pos-order-panel');
    var overlay = document.getElementById('order-panel-overlay');
    if (!panel) return;
    var isOpen = panel.classList.contains('open');
    if (isOpen) {
      panel.classList.remove('open');
      if (overlay) overlay.classList.remove('active');
      document.body.style.overflow = '';
    } else {
      panel.classList.add('open');
      if (overlay) overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
  }
  function closeOrderPanel() {
    var panel = document.querySelector('.pos-order-panel');
    var overlay = document.getElementById('order-panel-overlay');
    if (panel) panel.classList.remove('open');
    if (overlay) overlay.classList.remove('active');
    document.body.style.overflow = '';
  }

  // ==================== PAYMENT ====================
  function startCheckout(method) {
    if (APP.cart.length === 0) { showToast('Keranjang kosong', 'warning'); return; }
    var totals = getCartTotal();
    document.getElementById('pay-total-display').textContent = fmtRp(totals.total);
    var stepMap = { 'bayar-langsung': 'bayar', 'buat-pesanan': 'buat', 'gabungkan-pesanan': 'gabungkan' };
    goToPaymentStep(stepMap[method] || 'bayar');
    showModal('modal-payment');
  }

  function openPaymentModal() {
    // Backward compatibility: default langsung ke Bayar Langsung
    startCheckout('bayar-langsung');
  }

  function goToPaymentStep(step) {
    var steps = ['method', 'bayar', 'buat', 'gabungkan'];
    steps.forEach(function(s) {
      var el = document.getElementById('pay-step-' + s);
      if (el) el.style.display = 'none';
    });
    var closeBtn = document.getElementById('pay-btn-close');
    var kembaliBtn = document.getElementById('pay-btn-kembali');
    var bayarBtn = document.getElementById('pay-btn-bayar');
    var buatBtn = document.getElementById('pay-btn-buat');
    if (closeBtn) closeBtn.style.display = '';
    if (kembaliBtn) kembaliBtn.style.display = 'none';
    if (bayarBtn) bayarBtn.style.display = 'none';
    if (buatBtn) buatBtn.style.display = 'none';

    var titleEl = document.getElementById('pay-modal-title');

    if (step === 'method') {
      document.getElementById('pay-step-method').style.display = '';
      if (titleEl) titleEl.textContent = 'Checkout';
      // Reset checkout method card selections
      document.querySelectorAll('.checkout-method-card').forEach(function(c) { c.classList.remove('selected'); });

    } else if (step === 'bayar') {
      document.getElementById('pay-step-bayar').style.display = '';
      if (titleEl) titleEl.textContent = 'Bayar Langsung';
      if (closeBtn) closeBtn.style.display = 'none';
      if (kembaliBtn) kembaliBtn.style.display = '';
      if (bayarBtn) bayarBtn.style.display = '';
      // Reset
      document.getElementById('pay-amount').value = '';
      document.getElementById('pay-change').textContent = fmtRp(0);
      document.querySelectorAll('#pay-step-bayar .payment-option').forEach(function(o) { o.classList.remove('selected'); });
      var cashOpt = document.querySelector('#pay-step-bayar .payment-option[data-method="Cash"]');
      if (cashOpt) cashOpt.classList.add('selected');
      APP.selectedPayment = 'Cash';
      _populateKasirSelect('pay-kasir');

    } else if (step === 'buat') {
      document.getElementById('pay-step-buat').style.display = '';
      if (titleEl) titleEl.textContent = 'Buat Pesanan';
      if (closeBtn) closeBtn.style.display = 'none';
      if (kembaliBtn) kembaliBtn.style.display = '';
      if (buatBtn) buatBtn.style.display = '';
      var namaEl = document.getElementById('pay-nama-pelanggan');
      if (namaEl) namaEl.value = '';
      _populateKasirSelect('pay-kasir-pesanan');

    } else if (step === 'gabungkan') {
      document.getElementById('pay-step-gabungkan').style.display = '';
      if (titleEl) titleEl.textContent = 'Gabungkan Pesanan';
      if (closeBtn) closeBtn.style.display = 'none';
      if (kembaliBtn) kembaliBtn.style.display = '';
      loadGabungkanList();
    }
    APP.currentPayStep = step;
  }

  function _populateKasirSelect(selectId) {
    var sel = document.getElementById(selectId);
    if (!sel) return;
    var opts = '';
    var aktif = APP.kasirList.filter(function(k) { return k.status === 'Aktif'; });
    for (var i = 0; i < aktif.length; i++) {
      var selected = (APP.loggedInKasir && aktif[i].nama === APP.loggedInKasir.nama) ? ' selected' : '';
      opts += '<option value="' + aktif[i].nama + '"' + selected + '>' + aktif[i].nama + '</option>';
    }
    sel.innerHTML = opts;
  }

  function selectCheckoutMethod(method) {
    document.querySelectorAll('.checkout-method-card').forEach(function(c) { c.classList.remove('selected'); });
    event.currentTarget.classList.add('selected');
    var stepMap = { 'bayar-langsung': 'bayar', 'buat-pesanan': 'buat', 'gabungkan-pesanan': 'gabungkan' };
    setTimeout(function() { goToPaymentStep(stepMap[method]); }, 120);
  }

  function goBackToMethodSelect() {
    goToPaymentStep('method');
  }

  function selectPayment(method, el) {
    APP.selectedPayment = method;
    document.querySelectorAll('#pay-step-bayar .payment-option').forEach(function(o) { o.classList.remove('selected'); });
    el.classList.add('selected');
    if (method !== 'Cash') {
      var totals = getCartTotal();
      document.getElementById('pay-amount').value = totals.total;
      calcChange();
    } else {
      document.getElementById('pay-amount').value = '';
      document.getElementById('pay-change').textContent = fmtRp(0);
    }
  }

  function calcChange() {
    var totals = getCartTotal();
    var bayar = Number(document.getElementById('pay-amount').value) || 0;
    var kembalian = bayar - totals.total;
    document.getElementById('pay-change').textContent = fmtRp(Math.max(0, kembalian));
    document.getElementById('pay-change').style.color = kembalian >= 0 ? 'var(--success)' : 'var(--danger)';
  }

  function processPayment() {
    var totals = getCartTotal();
    var jumlahBayar = Number(document.getElementById('pay-amount').value) || 0;
    if (APP.selectedPayment === 'Cash' && jumlahBayar < totals.total) {
      showToast('Jumlah pembayaran kurang!', 'error'); return;
    }
    if (APP.selectedPayment !== 'Cash') jumlahBayar = totals.total;

    var kasirSel = document.getElementById('pay-kasir');
    var namaKasir = kasirSel ? kasirSel.value : (APP.loggedInKasir ? APP.loggedInKasir.nama : 'Kasir');
    var customerEl = document.getElementById('input-customer');

    var transaksiData = {
      items: APP.cart,
      namaPelanggan: customerEl ? customerEl.value : '',
      diskon: totals.diskon,
      jenisPembayaran: APP.selectedPayment,
      jumlahBayar: jumlahBayar,
      namaKasir: namaKasir,
      catatan: ''
    };

    showLoading(true);
    google.script.run
      .withSuccessHandler(function(res) {
        showLoading(false);
        if (res.success) {
          closeModal('modal-payment');
          APP.lastTransaksi = res.data;
          APP.lastTransaksi.namaKasir = namaKasir;
          showPaymentSuccess(res.data);
          APP.cart = [];
          updateOrderPanel();
          _refreshInitData();
          loadRecentTransactions();
        } else {
          showToast(res.message, 'error');
        }
      })
      .withFailureHandler(function(err) {
        showLoading(false);
        showToast('Error: ' + err.message, 'error');
      })
      .prosesTransaksi(transaksiData);
  }

  function showPaymentSuccess(data) {
    var html = '<div style="text-align:center">' +
      '<div class="success-check"><span class="material-icons-round">check</span></div>' +
      '<h3 style="margin-bottom:4px;">Pembayaran Berhasil!</h3>' +
      '<p style="color:var(--text-muted);margin-bottom:16px;">' + data.idTransaksi + '</p>' +
      '<div style="background:var(--bg);border-radius:var(--radius);padding:16px;text-align:left;margin-bottom:16px;">' +
      '<div class="summary-row"><span>Total</span><span style="font-weight:700">' + fmtRp(data.total) + '</span></div>' +
      '<div class="summary-row"><span>Bayar (' + data.jenisPembayaran + ')</span><span>' + fmtRp(data.jumlahBayar) + '</span></div>' +
      '<div class="summary-row"><span>Kembalian</span><span style="color:var(--success);font-weight:700">' + fmtRp(data.kembalian) + '</span></div>' +
      '</div></div>';
    document.getElementById('modal-success-body').innerHTML = html;
    document.getElementById('modal-success-footer').innerHTML =
      '<button class="btn btn-secondary" onclick="printReceipt()"><span class="material-icons-round">print</span> Cetak Struk</button>' +
      '<button class="btn btn-primary" onclick="closeModal(\'modal-success\')">Selesai</button>';
    showModal('modal-success');
  }

  // ==================== BUAT PESANAN ====================
  function submitBuatPesanan() {
    var namaPelanggan = (document.getElementById('pay-nama-pelanggan').value || '').trim();
    if (!namaPelanggan) { showToast('Nama pelanggan wajib diisi', 'warning'); return; }

    var kasirSel = document.getElementById('pay-kasir-pesanan');
    var namaKasir = kasirSel ? kasirSel.value : (APP.loggedInKasir ? APP.loggedInKasir.nama : 'Kasir');
    var totals = getCartTotal();

    showLoading(true);
    google.script.run
      .withSuccessHandler(function(res) {
        showLoading(false);
        if (res && res.success) {
          closeModal('modal-payment');
          APP.cart = [];
          updateOrderPanel();
          showBuatPesananSuccess(res.data);
          _refreshInitData();
        } else {
          showToast(res ? res.message : 'Gagal membuat pesanan', 'error');
        }
      })
      .withFailureHandler(function(err) {
        showLoading(false);
        showToast('Error: ' + (err ? err.message : 'Gagal'), 'error');
      })
      .buatPesanan({
        items: APP.cart,
        namaPelanggan: namaPelanggan,
        diskon: totals.diskon,
        namaKasir: namaKasir,
        catatan: ''
      });
  }

  // ==================== GABUNGKAN PESANAN ====================
  function loadGabungkanList() {
    var container = document.getElementById('gabungkan-list');
    if (!container) return;
    container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted)"><div class="spinner" style="margin:0 auto 10px;width:24px;height:24px;border-width:3px"></div>Memuat...</div>';

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          var list = res.data || [];
          if (list.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-muted)">' +
              '<span class="material-icons-round" style="font-size:36px;opacity:0.3">receipt_long</span>' +
              '<p style="margin-top:8px">Tidak ada pesanan aktif.</p>' +
              '<small>Buat pesanan baru terlebih dahulu.</small></div>';
            return;
          }
          var html = '';
          for (var i = 0; i < list.length; i++) {
            var p = list[i];
            var idSafe = p.id.replace(/'/g, '');
            html += '<div class="gabungkan-item" onclick="submitGabungkanPesanan(\'' + idSafe + '\')">' +
              '<div class="gabungkan-item-header">' +
              '<strong>' + p.namaPelanggan + '</strong>' +
              '<span class="badge badge-warning" style="font-size:10px">Diproses</span>' +
              '</div>' +
              '<div style="font-size:11px;color:var(--primary);font-weight:600;margin:2px 0">' + p.id + '</div>' +
              '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">' +
              '<span style="font-size:12px;color:var(--text-muted)">' + p.jumlahItem + ' item · ' + p.tanggal + '</span>' +
              '<span style="font-weight:700;color:var(--primary)">' + fmtRp(p.total) + '</span>' +
              '</div>' +
              '</div>';
          }
          container.innerHTML = html;
        } else {
          container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--danger)">Gagal memuat: ' + (res ? res.message : 'Error') + '</div>';
        }
      })
      .withFailureHandler(function(err) {
        container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--danger)">Error: ' + (err ? err.message : 'Gagal') + '</div>';
      })
      .getDaftarPesanan();
  }

  function submitGabungkanPesanan(idPesanan) {
    if (!confirm('Tambahkan ' + APP.cart.length + ' jenis item ke pesanan ' + idPesanan + '?')) return;
    var namaKasir = APP.loggedInKasir ? APP.loggedInKasir.nama : 'Kasir';

    showLoading(true);
    google.script.run
      .withSuccessHandler(function(res) {
        showLoading(false);
        if (res && res.success) {
          closeModal('modal-payment');
          APP.cart = [];
          updateOrderPanel();
          showToast(res.message, 'success');
          _refreshInitData();
        } else {
          showToast(res ? res.message : 'Gagal menggabungkan', 'error');
        }
      })
      .withFailureHandler(function(err) {
        showLoading(false);
        showToast('Error: ' + (err ? err.message : 'Gagal'), 'error');
      })
      .gabungkanPesanan(idPesanan, APP.cart, namaKasir);
  }

  // ==================== DAFTAR PESANAN ====================
  var _lastDaftarPesananData = [];
  var _pesananExpandedMap = {};

  function loadDaftarPesanan() {
    var container = document.getElementById('pesanan-list-container');
    if (container) container.innerHTML = '<div style="text-align:center;padding:60px 24px;color:var(--text-muted)"><div class="spinner" style="margin:0 auto 12px;width:28px;height:28px;border-width:3px"></div>Memuat pesanan...</div>';

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          _lastDaftarPesananData = res.data || [];
          renderDaftarPesanan(_lastDaftarPesananData);
        } else {
          if (container) container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--danger)">❌ ' + (res ? res.message : 'Error') + '</div>';
        }
      })
      .withFailureHandler(function(err) {
        if (container) container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--danger)">❌ ' + (err ? err.message : 'Gagal') + '</div>';
      })
      .getDaftarPesanan();
  }

  function togglePesananCard(idPesanan) {
    _pesananExpandedMap[idPesanan] = !_pesananExpandedMap[idPesanan];
    renderDaftarPesanan(_lastDaftarPesananData || []);
  }

  function renderDaftarPesanan(data) {
    var container = document.getElementById('pesanan-list-container');
    var countEl = document.getElementById('pesanan-count');
    if (countEl) countEl.textContent = data.length + ' pesanan';

    // Update nav badge
    var navBadge = document.getElementById('nav-pesanan-badge');
    if (navBadge) {
      navBadge.textContent = data.length;
      navBadge.style.display = data.length > 0 ? '' : 'none';
    }

    if (!data || data.length === 0) {
      container.innerHTML = '<div style="text-align:center;padding:60px 24px;color:var(--text-muted)">' +
        '<span class="material-icons-round" style="font-size:56px;opacity:0.25">receipt_long</span>' +
        '<p style="margin-top:12px;font-size:15px;font-weight:500">Tidak ada pesanan aktif</p>' +
        '<small>Buat pesanan dari halaman Kasir</small></div>';
      return;
    }

    var html = '';
    for (var i = 0; i < data.length; i++) {
      var p = data[i];
      var idSafe = p.id.replace(/'/g, '');
      var isExpanded = !!_pesananExpandedMap[p.id];
      var itemsHtml = '';
      for (var j = 0; j < p.items.length; j++) {
        var item = p.items[j];
        itemsHtml += '<div class="pesanan-detail-item">' +
          '<div>' +
          '<span class="pesanan-detail-nama">' + item.nama + '</span>' +
          (item.catatan ? '<div class="pesanan-detail-catatan">' + item.catatan + '</div>' : '') +
          '</div>' +
          '<div style="text-align:right;white-space:nowrap">' +
          '<span style="color:var(--text-muted);font-size:12px">' + fmtRp(item.harga) + ' × ' + item.jumlah + '</span> ' +
          '<strong style="font-size:13px">' + fmtRp(item.subtotal) + '</strong>' +
          '</div>' +
          '</div>';
      }

      html += '<div class="pesanan-card">' +
        '<div class="pesanan-card-header" onclick="togglePesananCard(\'' + idSafe + '\')">' +
        '<div style="flex:1;min-width:0;">' +
        '<span class="badge badge-warning" style="margin-bottom:6px;display:inline-block">Diproses</span>' +
        '<div class="pesanan-card-nama">' + p.namaPelanggan + '</div>' +
        '<div class="pesanan-card-meta">No. <span style="color:var(--primary);font-weight:600">' + p.id + '</span></div>' +
        '<div class="pesanan-card-meta">' + p.tanggal + ' · Kasir: ' + p.kasir + '</div>' +
        '</div>' +
        '<div style="text-align:right;display:flex;align-items:center;gap:8px;flex-shrink:0;">' +
        '<div>' +
        '<div style="font-size:11px;color:var(--text-muted)">Total</div>' +
        '<div style="font-size:20px;font-weight:800;color:var(--primary)">' + fmtRp(p.total) + '</div>' +
        '</div>' +
        '<span class="material-icons-round pesanan-chevron' + (isExpanded ? ' expanded' : '') + '">expand_more</span>' +
        '</div>' +
        '</div>' +
        '<div class="pesanan-card-body' + (isExpanded ? ' expanded' : '') + '">' +
        '<div class="pesanan-card-items">' + itemsHtml + '</div>' +
        '<div class="pesanan-card-summary">' +
        '<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0"><span>Total Pesanan</span><span style="font-weight:600">' + fmtRp(p.subtotal) + '</span></div>' +
        (p.pajak > 0 ? '<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0"><span>Pajak</span><span>' + fmtRp(p.pajak) + '</span></div>' : '') +
        (p.diskon > 0 ? '<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0"><span>Diskon</span><span style="color:var(--danger)">-' + fmtRp(p.diskon) + '</span></div>' : '') +
        '<div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--border);margin-top:4px"><strong>Total</strong><strong style="color:var(--primary);font-size:15px">' + fmtRp(p.total) + '</strong></div>' +
        '</div>' +
        '<div class="pesanan-card-actions">' +
        '<button class="btn btn-sm" style="border:1px solid var(--danger);color:var(--danger);background:transparent" onclick="batalkanPesananFE(\'' + idSafe + '\')">' +
        '<span class="material-icons-round" style="font-size:14px">cancel</span> Batalkan' +
        '</button>' +
        '<button class="btn btn-primary" onclick="openBayarPesananModal(\'' + idSafe + '\',' + p.total + ')">' +
        '<span class="material-icons-round" style="font-size:14px">payments</span> Proses Pembayaran' +
        '</button>' +
        '</div>' +
        '</div>' +
        '</div>';
    }
    container.innerHTML = html;
  }

  // ==================== BAYAR PESANAN (dari Daftar Pesanan) ====================
  function openBayarPesananModal(idPesanan, total) {
    APP.selectedPesananId = idPesanan;
    APP.selectedPesananTotal = Number(total);
    APP.selectedBayarPesananMethod = 'Cash';

    var summaryEl = document.getElementById('bayar-pesanan-summary');
    if (summaryEl) {
      summaryEl.innerHTML = '<div style="text-align:center;margin-bottom:16px;padding:12px;background:var(--primary-bg);border-radius:var(--radius-sm)">' +
        '<div style="font-size:12px;color:var(--text-muted)">Total Pembayaran</div>' +
        '<div style="font-size:28px;font-weight:800;color:var(--primary)">' + fmtRp(total) + '</div>' +
        '<div style="font-size:11px;color:var(--text-muted);margin-top:2px">No. ' + idPesanan + '</div>' +
        '</div>';
    }

    document.querySelectorAll('#modal-bayar-pesanan .payment-option').forEach(function(o) { o.classList.remove('selected'); });
    var cashOpt = document.querySelector('#modal-bayar-pesanan .payment-option[data-method="Cash"]');
    if (cashOpt) cashOpt.classList.add('selected');

    _populateKasirSelect('bayar-pesanan-kasir');
    document.getElementById('bayar-pesanan-amount').value = '';
    document.getElementById('bayar-pesanan-change').textContent = fmtRp(0);
    document.getElementById('bayar-pesanan-change').style.color = 'var(--success)';

    showModal('modal-bayar-pesanan');
  }

  function selectBayarPesananMethod(method, el) {
    APP.selectedBayarPesananMethod = method;
    document.querySelectorAll('#modal-bayar-pesanan .payment-option').forEach(function(o) { o.classList.remove('selected'); });
    el.classList.add('selected');
    if (method !== 'Cash') {
      document.getElementById('bayar-pesanan-amount').value = APP.selectedPesananTotal;
      calcBayarPesananChange();
    } else {
      document.getElementById('bayar-pesanan-amount').value = '';
      document.getElementById('bayar-pesanan-change').textContent = fmtRp(0);
    }
  }

  function calcBayarPesananChange() {
    var total = APP.selectedPesananTotal || 0;
    var bayar = Number(document.getElementById('bayar-pesanan-amount').value) || 0;
    var kembalian = bayar - total;
    var el = document.getElementById('bayar-pesanan-change');
    if (el) {
      el.textContent = fmtRp(Math.max(0, kembalian));
      el.style.color = kembalian >= 0 ? 'var(--success)' : 'var(--danger)';
    }
  }

  function submitBayarPesanan() {
    var idPesanan = APP.selectedPesananId;
    var total = APP.selectedPesananTotal;
    var jenisPembayaran = APP.selectedBayarPesananMethod || 'Cash';
    var jumlahBayar = Number(document.getElementById('bayar-pesanan-amount').value) || 0;

    if (jenisPembayaran === 'Cash' && jumlahBayar < total) {
      showToast('Jumlah pembayaran kurang!', 'error'); return;
    }
    if (jenisPembayaran !== 'Cash') jumlahBayar = total;

    var kasirSel = document.getElementById('bayar-pesanan-kasir');
    var namaKasir = kasirSel ? kasirSel.value : (APP.loggedInKasir ? APP.loggedInKasir.nama : 'Kasir');

    showLoading(true);
    google.script.run
      .withSuccessHandler(function(res) {
        showLoading(false);
        if (res && res.success) {
          closeModal('modal-bayar-pesanan');
          APP.lastTransaksi = res.data;
          APP.lastTransaksi.namaKasir = namaKasir;
          showPaymentSuccess(res.data);
          loadDaftarPesanan();
          _refreshInitData();
        } else {
          showToast(res ? res.message : 'Gagal memproses pembayaran', 'error');
        }
      })
      .withFailureHandler(function(err) {
        showLoading(false);
        showToast('Error: ' + (err ? err.message : 'Gagal'), 'error');
      })
      .prosesPembayaranPesanan(idPesanan, { jenisPembayaran: jenisPembayaran, jumlahBayar: jumlahBayar, namaKasir: namaKasir });
  }

  function batalkanPesananFE(idPesanan) {

  function printReceipt() {

    var namaToko = APP.settings.nama_toko || 'Toko Saya';
    var alamat = APP.settings.alamat || '';
    var telepon = APP.settings.telepon || '';

    var receiptHtml = '<div class="thermal-receipt">' +
      '<div class="receipt-center"><div class="receipt-bold" style="font-size:14px;">' + namaToko + '</div>' +
      (alamat ? '<div>' + alamat + '</div>' : '') +
      (telepon ? '<div>Telp: ' + telepon + '</div>' : '') +
      '</div>' +
      '<div class="receipt-line"></div>' +
      '<div class="receipt-row"><span>No:</span><span>' + data.idTransaksi + '</span></div>' +
      '<div class="receipt-row"><span>Tgl:</span><span>' + data.tanggal + '</span></div>' +
      '<div class="receipt-row"><span>Kasir:</span><span>' + (data.namaKasir || '-') + '</span></div>' +
      '<div class="receipt-line"></div>';

    // Items
    for (var i = 0; i < data.items.length; i++) {
      var item = data.items[i];
      var qty = item.jumlah;
      var harga = Number(item.harga);
      var sub = qty * harga;
      receiptHtml += '<div>' + item.nama + '</div>' +
        '<div class="receipt-row"><span>  ' + qty + ' x ' + fmtRp(harga) + '</span><span>' + fmtRp(sub) + '</span></div>';
    }

    receiptHtml += '<div class="receipt-line"></div>' +
      '<div class="receipt-row"><span>Subtotal</span><span>' + fmtRp(data.subtotal) + '</span></div>';

    if (data.pajak > 0) {
      receiptHtml += '<div class="receipt-row"><span>Pajak</span><span>' + fmtRp(data.pajak) + '</span></div>';
    }
    if (data.diskon > 0) {
      receiptHtml += '<div class="receipt-row"><span>Diskon</span><span>-' + fmtRp(data.diskon) + '</span></div>';
    }

    receiptHtml += '<div class="receipt-line"></div>' +
      '<div class="receipt-row receipt-bold receipt-lg"><span>TOTAL</span><span>' + fmtRp(data.total) + '</span></div>' +
      '<div class="receipt-line"></div>' +
      '<div class="receipt-row"><span>Bayar (' + data.jenisPembayaran + ')</span><span>' + fmtRp(data.jumlahBayar) + '</span></div>' +
      '<div class="receipt-row receipt-bold"><span>Kembali</span><span>' + fmtRp(data.kembalian) + '</span></div>' +
      '<div class="receipt-line"></div>' +
      '<div class="receipt-center" style="margin-top:8px;">' +
      '<div>Terima kasih!</div>' +
      '<div style="font-size:10px;margin-top:4px;">- ' + namaToko + ' -</div>' +
      '</div></div>';

    // Put in print area and trigger print
    var printArea = document.getElementById('receipt-print-area');
    printArea.innerHTML = receiptHtml;
    printArea.style.display = 'block';

    setTimeout(function () {
      window.print();
      setTimeout(function () { printArea.style.display = 'none'; }, 500);
    }, 200);
  }

  function setRiwayatPreset(preset, noFilter) {
    _riwayatPreset = preset;
    var now = new Date();
    var fromEl = document.getElementById('riwayat-filter-tanggal');
    var labelEl = document.getElementById('date-filter-label');

    // Update active state on preset buttons
    var items = document.querySelectorAll('.date-preset-item');
    items.forEach(function (btn) { btn.classList.remove('active'); });

    var labelText = '';
    switch (preset) {
      case 'hari-ini':
        if (fromEl) fromEl.value = fmtDateISO(now);
        labelText = 'Hari Ini';
        if (items[0]) items[0].classList.add('active');
        break;
      case '7-hari':
        labelText = '7 Hari';
        if (fromEl) fromEl.value = '';
        if (items[1]) items[1].classList.add('active');
        break;
      case '30-hari':
        labelText = '30 Hari';
        if (fromEl) fromEl.value = '';
        if (items[2]) items[2].classList.add('active');
        break;
      case 'bulan-ini':
        labelText = 'Bulan Ini';
        if (fromEl) fromEl.value = '';
        if (items[3]) items[3].classList.add('active');
        break;
      case 'semua':
        labelText = 'Semua';
        if (fromEl) fromEl.value = '';
        if (items[4]) items[4].classList.add('active');
        break;
      case 'custom':
        var val = fromEl ? fromEl.value : '';
        labelText = val || 'Tanggal';
        break;
    }
    if (labelEl) labelEl.textContent = labelText;

    // Close popover
    var popover = document.getElementById('date-filter-popover');
    if (popover) popover.classList.remove('show');

    if (!noFilter) {
      _riwayatPage = 1;
      filterRiwayat();
    }
  }

  // Parse tanggal dari string "dd/MM/yyyy HH:mm" ke Date obj (start of day)
  function parseTanggalRiwayat(tanggalStr) {
    if (!tanggalStr || tanggalStr === '-') return null;
    // format: dd/MM/yyyy HH:mm
    var parts = tanggalStr.split(' ');
    var dateParts = parts[0].split('/');
    if (dateParts.length !== 3) return null;
    var day = parseInt(dateParts[0]);
    var month = parseInt(dateParts[1]) - 1;
    var year = parseInt(dateParts[2]);
    return new Date(year, month, day);
  }

  function renderRiwayat(data) {
    // Hitung summary
    var totalSelesai = 0, totalBatal = 0, totalOmzet = 0;
    for (var i = 0; i < data.length; i++) {
      if (data[i].status === 'Selesai') { totalSelesai++; totalOmzet += Number(data[i].total || 0); }
      else if (data[i].status === 'Dibatalkan') { totalBatal++; }
    }
    var elTotal = document.getElementById('riwayat-stat-total');
    var elSelesai = document.getElementById('riwayat-stat-selesai');
    var elBatal = document.getElementById('riwayat-stat-batal');
    var elOmzet = document.getElementById('riwayat-stat-omzet');
    if (elTotal) elTotal.textContent = data.length;
    if (elSelesai) elSelesai.textContent = totalSelesai;
    if (elBatal) elBatal.textContent = totalBatal;
    if (elOmzet) elOmzet.textContent = fmtRp(totalOmzet);

    // Pagination calc
    var totalPages = Math.max(1, Math.ceil(data.length / _riwayatPerPage));
    if (_riwayatPage > totalPages) _riwayatPage = totalPages;
    var startIdx = (_riwayatPage - 1) * _riwayatPerPage;
    var endIdx = Math.min(startIdx + _riwayatPerPage, data.length);
    var pageData = data.slice(startIdx, endIdx);

    var countEl = document.getElementById('riwayat-count');
    if (countEl) countEl.textContent = 'Menampilkan ' + (data.length > 0 ? (startIdx + 1) : 0) + '-' + endIdx + ' dari ' + data.length + ' transaksi';

    var tbody = document.getElementById('riwayat-tbody');
    if (!tbody) return;
    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:30px;color:var(--text-muted)">Tidak ada transaksi ditemukan</td></tr>';
      updatePaginationUI(0, 1);
      return;
    }
    var html = '';
    for (var j = 0; j < pageData.length; j++) {
      var t = pageData[j];
      var statusClass = t.status === 'Selesai' ? 'status-selesai' :
                        t.status === 'Pesanan'  ? 'status-pending'  : 'status-dibatalkan';

      // Tampilan waktu: jika ada waktuPembayaran tampilkan itu, else tanggal biasa
      // Jika merupakan pesanan hold yg dibayar beda hari, tambahkan badge info
      var waktuHtml = '';
      if (t.isPesananHold && t.tanggalPesanan && t.waktuPembayaran) {
        waktuHtml = '<span style="white-space:nowrap">' + t.waktuPembayaran +
          ' <span title="Pesanan dibuat: ' + t.tanggalPesanan + '" style="display:inline-flex;align-items:center;gap:2px;background:#f59e0b22;color:#b45309;border:1px solid #fcd34d;border-radius:4px;padding:1px 5px;font-size:10px;font-weight:600;cursor:help">' +
          '<span class="material-icons-round" style="font-size:11px">schedule</span>Hold</span></span>';
      } else {
        waktuHtml = '<span style="white-space:nowrap">' + (t.tanggal || '-') + '</span>';
      }

      html += '<tr class="riwayat-row" onclick="showDetailTransaksi(\'' + t.id + '\')" style="cursor:pointer" title="Klik untuk lihat detail">' +
        '<td><strong>' + t.id + '</strong></td>' +
        '<td>' + waktuHtml + '</td>' +
        '<td>' + (t.pelanggan || '—') + '</td>' +
        '<td>' + (t.jumlahItem || 0) + ' item</td>' +
        '<td><strong>' + fmtRp(t.total) + '</strong></td>' +
        '<td>' + (t.jenisPembayaran || '-') + '</td>' +
        '<td>' + (t.kasir || '-') + '</td>' +
        '<td><span class="' + statusClass + '">' + t.status + '</span></td>' +
        '<td style="display:flex;gap:4px;">' +
        '<button class="btn btn-sm btn-secondary" onclick="event.stopPropagation();showDetailTransaksi(\'' + t.id + '\')" title="Detail"><span class="material-icons-round" style="font-size:14px">visibility</span></button>' +
        '<button class="btn btn-sm btn-danger" onclick="event.stopPropagation();confirmHapusTransaksi(\'' + t.id + '\',\'' + t.status + '\')" title="Hapus"><span class="material-icons-round" style="font-size:14px">delete</span></button>' +
        '</td>' +
        '</tr>';
    }
    tbody.innerHTML = html;
    updatePaginationUI(data.length, totalPages);
  }

  function updatePaginationUI(totalItems, totalPages) {
    var prevBtn = document.getElementById('riwayat-prev');
    var nextBtn = document.getElementById('riwayat-next');
    var pageNum = document.getElementById('riwayat-page-num');
    var pageInfo = document.getElementById('riwayat-page-info');
    var paginationBar = document.getElementById('riwayat-pagination');

    if (paginationBar) paginationBar.style.display = totalItems > _riwayatPerPage ? 'flex' : 'none';
    if (prevBtn) prevBtn.disabled = _riwayatPage <= 1;
    if (nextBtn) nextBtn.disabled = _riwayatPage >= totalPages;
    if (pageNum) pageNum.textContent = _riwayatPage + ' / ' + totalPages;
    if (pageInfo) pageInfo.textContent = 'Halaman ' + _riwayatPage + ' dari ' + totalPages;
  }

  function riwayatPrevPage() {
    if (_riwayatPage > 1) {
      _riwayatPage--;
      renderRiwayat(_filteredRiwayatData);
    }
  }

  function riwayatNextPage() {
    var totalPages = Math.ceil(_filteredRiwayatData.length / _riwayatPerPage);
    if (_riwayatPage < totalPages) {
      _riwayatPage++;
      renderRiwayat(_filteredRiwayatData);
    }
  }

  function filterRiwayat() {
    var keyword = (document.getElementById('riwayat-search') || { value: '' }).value.toLowerCase();
    var filterStatus = (document.getElementById('riwayat-filter-status') || { value: '' }).value;

    // Determine date range based on preset
    var now = new Date();
    var startDate = null;
    var endDate = null;
    var specificDate = null;

    switch (_riwayatPreset) {
      case 'hari-ini':
        startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        endDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        break;
      case '7-hari':
        endDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        startDate = new Date(endDate);
        startDate.setDate(startDate.getDate() - 6);
        break;
      case '30-hari':
        endDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        startDate = new Date(endDate);
        startDate.setDate(startDate.getDate() - 29);
        break;
      case 'bulan-ini':
        startDate = new Date(now.getFullYear(), now.getMonth(), 1);
        endDate = new Date(now.getFullYear(), now.getMonth() + 1, 0);
        break;
      case 'custom':
        var customVal = (document.getElementById('riwayat-filter-tanggal') || { value: '' }).value;
        if (customVal) {
          var parsed = new Date(customVal + 'T00:00:00');
          if (!isNaN(parsed.getTime())) {
            specificDate = parsed;
          }
        }
        break;
      case 'semua':
      default:
        break;
    }

    _filteredRiwayatData = _allRiwayatData.filter(function (t) {
      // Keyword filter
      var matchKeyword = !keyword ||
        (t.id && t.id.toLowerCase().indexOf(keyword) >= 0) ||
        (t.kasir && t.kasir.toLowerCase().indexOf(keyword) >= 0) ||
        (t.pelanggan && t.pelanggan.toLowerCase().indexOf(keyword) >= 0);
      // Status filter
      var matchStatus = !filterStatus || t.status === filterStatus;
      // Date filter
      var matchDate = true;
      if (startDate || endDate || specificDate) {
        var tDate = parseTanggalRiwayat(t.tanggal);
        if (tDate) {
          if (specificDate) {
            matchDate = tDate.getFullYear() === specificDate.getFullYear() &&
              tDate.getMonth() === specificDate.getMonth() &&
              tDate.getDate() === specificDate.getDate();
          } else {
            if (startDate && tDate < startDate) matchDate = false;
            if (endDate && tDate > endDate) matchDate = false;
          }
        } else {
          matchDate = false;
        }
      }
      return matchKeyword && matchStatus && matchDate;
    });
    renderRiwayat(_filteredRiwayatData);
  }

    var tbody = document.getElementById('produk-tbody');
    if (tbody) tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--text-muted)">Memuat data...</td></tr>';

    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.success) {
          _allProdukAdminData = res.data || [];
          renderProdukTable(_allProdukAdminData);
          // Populate dynamic kategori filter
          var katSel = document.getElementById('filter-kategori-admin');
          if (katSel) {
            var katSet = {};
            for (var i = 0; i < _allProdukAdminData.length; i++) {
              if (_allProdukAdminData[i].kategori) katSet[_allProdukAdminData[i].kategori] = true;
            }
            var opts = '<option value="">Semua Kategori</option>';
            Object.keys(katSet).sort().forEach(function (k) {
              opts += '<option value="' + k + '">' + k + '</option>';
            });
            katSel.innerHTML = opts;
          }
        } else {
          var msg = res ? res.message : 'Terjadi kesalahan';
          if (tbody) tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--danger)">❌ ' + msg + '</td></tr>';
          showToast(msg, 'error');
        }
      })
      .withFailureHandler(function (err) {
        var msg = err ? err.message : 'Gagal terhubung ke server';
        if (tbody) tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--danger)">❌ Error: ' + msg + '</td></tr>';
        showToast('Gagal memuat produk: ' + msg, 'error');
      })
      .getAllProdukAdmin();

  // Isi dropdown kategori di form produk dari data produk yang sudah dimuat
  function populateKategoriDropdown(selectedValue) {
    var sel = document.getElementById('produk-kategori');
    if (!sel) return;
    var katSet = {};
    // Dari cache produk admin
    for (var i = 0; i < _allProdukAdminData.length; i++) {
      if (_allProdukAdminData[i].kategori) katSet[_allProdukAdminData[i].kategori] = true;
    }
    // Juga dari APP.produk jika ada
    if (window.APP && APP.produk) {
      for (var j = 0; j < APP.produk.length; j++) {
        if (APP.produk[j].kategori) katSet[APP.produk[j].kategori] = true;
      }
    }
    var html = '<option value="">Pilih kategori...</option>';
    Object.keys(katSet).sort().forEach(function (k) {
      var selected = (k === selectedValue) ? ' selected' : '';
      html += '<option value="' + k + '"' + selected + '>' + k + '</option>';
    });
    sel.innerHTML = html;
  }

  function renderProdukTable(data) {
    var tbody = document.getElementById('produk-tbody');
    if (!tbody) return;
    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--text-muted)">Belum ada produk</td></tr>';
      return;
    }
    var html = '';
    var placeholder = 'https://placehold.co/40/e2e8f0/94a3b8?text=-';
    for (var i = 0; i < data.length; i++) {
      var p = data[i];
      var isAktif = p.status === 'Aktif';
      var toggleColor = isAktif
        ? 'background:var(--success-bg);color:var(--success)'
        : 'background:var(--warning-bg);color:var(--warning)';
      var toggleIcon = isAktif ? 'toggle_on' : 'toggle_off';
      var toggleLabel = isAktif ? 'Aktif' : 'Nonaktif';
      var toggleTitle = isAktif ? 'Klik untuk nonaktifkan' : 'Klik untuk aktifkan';
      var namaSafe = p.nama ? p.nama.replace(/'/g, '') : '';
      var imgSrc = (p.gambar || '').replace(/'/g, '');

      html += '<tr>' +
        '<td>' + p.id + '</td>' +
        '<td>' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
        '<img src="' + imgSrc + '" style="width:36px;height:36px;border-radius:6px;object-fit:cover" onerror="this.style.display=\'none\'">' +
        '<span>' + p.nama + '</span>' +
        '</div>' +
        '</td>' +
        '<td>' + p.kategori + '</td>' +
        '<td>' + fmtRp(p.harga) + '</td>' +
        '<td>' + (p.stokDariBahan || 0) + ' porsi</td>' +
        '<td>' +
        '<button onclick="toggleStatusProdukFE(\'' + p.id + '\')" ' +
        'style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;border:none;cursor:pointer;' + toggleColor + '" ' +
        'title="' + toggleTitle + '">' +
        '<span class="material-icons-round" style="font-size:15px">' + toggleIcon + '</span>' +
        toggleLabel +
        '</button>' +
        '</td>' +
        '<td>' +
        '<button class="btn btn-sm btn-secondary" onclick="editProdukForm(\'' + p.id + '\')" title="Edit">' +

        '<span class="material-icons-round" style="font-size:14px">delete</span>' +

  function editProdukForm(id) {
    showLoading(true);
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res.success) { showLoading(false); showToast(res.message, 'error'); return; }
        var p = res.data;
        // Load resep for this product
        google.script.run
          .withSuccessHandler(function (resepRes) {
            showLoading(false);
            document.getElementById('produk-form-title').textContent = 'Edit Produk';
            document.getElementById('produk-id-edit').value = p.id;
            document.getElementById('produk-nama').value = p.nama;
            populateKategoriDropdown(p.kategori);
            document.getElementById('produk-harga').value = p.harga;
            document.getElementById('produk-deskripsi').value = p.deskripsi || '';
            document.getElementById('produk-gambar').value = p.gambar || '';
            var statusGroup = document.getElementById('produk-status-group');
            var statusSel = document.getElementById('produk-status');
            if (statusGroup) statusGroup.style.display = 'block';
            if (statusSel) statusSel.value = p.status || 'Aktif';
            // Load resep
            APP.resepEditTemp = (resepRes && resepRes.success) ? (resepRes.data || []) : [];
            renderResepList();
            showModal('modal-produk');
          })
          .withFailureHandler(function() {
            showLoading(false);
            APP.resepEditTemp = [];
            renderResepList();
            showModal('modal-produk');
          })
          .getResepByProduk(p.id);

      .withFailureHandler(function (e) { showLoading(false); showToast(e.message, 'error'); })

  function saveProduk() {
    var id = document.getElementById('produk-id-edit').value;
    var statusEl = document.getElementById('produk-status');
    var data = {
      nama: document.getElementById('produk-nama').value,
      kategori: document.getElementById('produk-kategori').value,
      harga: document.getElementById('produk-harga').value,
      deskripsi: document.getElementById('produk-deskripsi').value,
      gambar: document.getElementById('produk-gambar').value,
      status: (id && statusEl) ? statusEl.value : 'Aktif'
    };
    if (!data.nama || !data.kategori || !data.harga) {
      showToast('Nama, kategori, dan harga wajib diisi', 'warning');
      return;
    }
    showLoading(true);
    var fn = id ? 'editProduk' : 'tambahProduk';
    if (id) data.id = id;
    var resepItems = APP.resepEditTemp || [];
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res.success) { showLoading(false); showToast(res.message, 'error'); return; }
        var savedId = res.data ? (res.data.id || id) : id;
        var namaProduk = data.nama;
        // Simpan resep setelah produk berhasil disimpan
        google.script.run
          .withSuccessHandler(function(resepRes) {
            showLoading(false);
            closeModal('modal-produk');
            showToast(res.message, 'success');
            loadProdukAdmin();
            refreshMainProduk();
          })
          .withFailureHandler(function() {
            showLoading(false);
            closeModal('modal-produk');
            showToast(res.message + ' (Resep gagal disimpan)', 'warning');
            loadProdukAdmin();
            refreshMainProduk();
          })
          .saveResepProduk(savedId, namaProduk, resepItems);
      })
      .withFailureHandler(function (e) { showLoading(false); showToast(e.message, 'error'); })
    [fn](data);
  }

  function loadLaporan() {
    // Pastikan date input selalu terisi hari ini jika kosong
    var tanggalEl = document.getElementById('laporan-tanggal');
    if (tanggalEl && !tanggalEl.value) {
      tanggalEl.value = fmtDateISO(new Date());
    }
    var periode = document.querySelector('.tab-btn.active');
    var periodeVal = periode ? periode.dataset.periode : 'harian';
    switchLaporanPeriode(periodeVal);
    // Also load item terjual report
    loadLaporanItem();
  }

  function switchLaporanPeriode(periode) {
    document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
    var btn = document.querySelector('.tab-btn[data-periode="' + periode + '"]');
    if (btn) btn.classList.add('active');

    var tanggalEl = document.getElementById('laporan-tanggal');
    var now = new Date();

    // Selalu fallback ke hari ini jika input kosong atau Invalid Date
    var refDate = now;
    if (tanggalEl && tanggalEl.value) {
      // Tambahkan T00:00:00 untuk paksa local time (bukan UTC)
      var parsed = new Date(tanggalEl.value + 'T00:00:00');
      if (!isNaN(parsed.getTime())) refDate = parsed;
    }

    var filter = {};
    if (periode === 'harian') {
      filter.tanggalMulai = fmtDateISO(refDate);
      filter.tanggalAkhir = fmtDateISO(refDate);
    } else if (periode === 'mingguan') {
      var day = refDate.getDay();
      var mulai = new Date(refDate); mulai.setDate(refDate.getDate() - day);
      var akhir = new Date(mulai); akhir.setDate(mulai.getDate() + 6);
      filter.tanggalMulai = fmtDateISO(mulai);
      filter.tanggalAkhir = fmtDateISO(akhir);
    } else {
      var mulai2 = new Date(refDate.getFullYear(), refDate.getMonth(), 1);
      var akhir2 = new Date(refDate.getFullYear(), refDate.getMonth() + 1, 0);
      filter.tanggalMulai = fmtDateISO(mulai2);
      filter.tanggalAkhir = fmtDateISO(akhir2);
    }

    var tbody = document.getElementById('laporan-tbody');
    if (tbody) tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:20px;color:var(--text-muted)">Memuat laporan...</td></tr>';

    loadGrafikPendapatan(filter);

    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.success) {
          renderLaporan(res.data);
        } else {
          var msg = res ? res.message : 'Terjadi kesalahan';
          if (tbody) tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:20px;color:var(--danger)">Gagal: ' + msg + '</td></tr>';
          showToast(msg, 'error');
        }
      })
      .withFailureHandler(function (err) {
        var msg = err ? err.message : 'Gagal terhubung ke server';
        if (tbody) tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:20px;color:var(--danger)">Error: ' + msg + '</td></tr>';
        showToast('Gagal memuat laporan: ' + msg, 'error');
      })
      .getLaporan(filter);
  }

  var _lastLaporanData = null;

  function renderLaporan(data) {
    _lastLaporanData = data;
    var r = data.ringkasan;
    document.getElementById('stat-total-trx').textContent = r.totalTransaksi;
    document.getElementById('stat-pendapatan').textContent = fmtRp(r.totalPendapatan);
    document.getElementById('stat-rata').textContent = fmtRp(r.rataRata);
    document.getElementById('stat-pajak').textContent = fmtRp(r.totalPajak);
    var elDiskon = document.getElementById('stat-diskon');
    if (elDiskon) elDiskon.textContent = fmtRp(r.totalDiskon || 0);

    // Payment breakdown dengan progress bar
    var payDiv = document.getElementById('payment-breakdown');
    if (payDiv) {
      if (!data.pembayaran || data.pembayaran.length === 0) {
        payDiv.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:16px">Tidak ada data</p>';
      } else {
        var totalSemua = 0;
        for (var pi = 0; pi < data.pembayaran.length; pi++) totalSemua += data.pembayaran[pi].total;
        var payColors = ['var(--primary)', 'var(--success)', 'var(--warning)', 'var(--danger)', '#8b5cf6'];
        var ph = '';
        for (var i = 0; i < data.pembayaran.length; i++) {
          var p = data.pembayaran[i];
          var pct = totalSemua > 0 ? Math.round((p.total / totalSemua) * 100) : 0;
          var color = payColors[i % payColors.length];
          ph += '<div style="margin-bottom:14px">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">' +
            '<div style="display:flex;align-items:center;gap:8px">' +
            '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + color + '"></span>' +
            '<span style="font-size:13px;font-weight:600">' + p.metode + '</span>' +
            '<span style="font-size:11px;color:var(--text-muted)">(' + p.jumlah + 'x)</span>' +
            '</div>' +
            '<div style="text-align:right">' +
            '<span style="font-size:13px;font-weight:700">' + fmtRp(p.total) + '</span>' +
            '<span style="font-size:11px;color:var(--text-muted);margin-left:6px">' + pct + '%</span>' +
            '</div></div>' +
            '<div class="pay-bar-track"><div class="pay-bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
            '</div>';
        }
        payDiv.innerHTML = ph;
      }
    }

    // Jumlah transaksi label
    var countEl = document.getElementById('laporan-trx-count');
    if (countEl && data.transaksi) countEl.textContent = data.transaksi.length + ' transaksi';

    var tbody = document.getElementById('laporan-tbody');
    if (tbody) {
      if (!data.transaksi || data.transaksi.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:20px;color:var(--text-muted)">Tidak ada transaksi</td></tr>';
      } else {
        var thtml = '';
        for (var j = 0; j < data.transaksi.length; j++) {
          var t = data.transaksi[j];
          var statusClass = t.status === 'Selesai' ? 'status-selesai' : 'status-dibatalkan';

  function renderGrafikPendapatan(data) {
    var container = document.getElementById('grafik-pendapatan-container');
    if (!container) return;
    if (!data || data.length === 0) {
      container.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:24px">Tidak ada data untuk periode ini</p>';
      return;
    }
    var maxVal = 0;
    for (var i = 0; i < data.length; i++) { if (data[i].total > maxVal) maxVal = data[i].total; }
    if (maxVal === 0) maxVal = 1;

    var html = '<div class="grafik-bar-chart">';
    for (var j = 0; j < data.length; j++) {
      var d = data[j];
      var heightPct = Math.max(4, Math.round((d.total / maxVal) * 100));
      var label = d.tanggal ? d.tanggal.split('/').slice(0,2).join('/') : '';
      html += '<div class="grafik-bar-col" title="' + d.tanggal + '\n' + fmtRp(d.total) + ' (' + d.transaksi + ' trx)">' +
        '<div class="grafik-bar-val">' + (d.total >= 1000000 ? (Math.round(d.total/100000)/10)+'jt' : d.total >= 1000 ? Math.round(d.total/1000)+'rb' : d.total) + '</div>' +
        '<div class="grafik-bar-wrap"><div class="grafik-bar" style="height:' + heightPct + '%"></div></div>' +
        '<div class="grafik-bar-lbl">' + label + '</div>' +
        '</div>';
    }
    html += '</div>';

    // Update label range
    var rangeEl = document.getElementById('grafik-range-label');
    if (rangeEl && data.length > 0) {
      rangeEl.textContent = data[0].tanggal + (data.length > 1 ? ' – ' + data[data.length-1].tanggal : '');
    }

    container.innerHTML = html;
  }

  // ==================== EXPORT CSV ====================
  function exportLaporanCSV() {
    if (!_lastLaporanData || !_lastLaporanData.transaksi || _lastLaporanData.transaksi.length === 0) {
      showToast('Tidak ada data untuk diekspor', 'warning');
      return;
    }
    var rows = [['ID Transaksi','Waktu','Pelanggan','Jumlah Item','Subtotal','Pajak','Diskon','Total','Pembayaran','Kasir','Status']];
    var t = _lastLaporanData.transaksi;
    for (var i = 0; i < t.length; i++) {
      rows.push([
        t[i].id, t[i].tanggal, t[i].pelanggan || '-',
        t[i].jumlahItem, t[i].subtotal || 0, t[i].pajak || 0, t[i].diskon || 0, t[i].total,
        t[i].jenisPembayaran, t[i].kasir || '-', t[i].status
      ]);
    }
    var csvContent = rows.map(function(row) {
      return row.map(function(cell) {
        var s = String(cell === null || cell === undefined ? '' : cell);
        if (s.indexOf(',') !== -1 || s.indexOf('"') !== -1 || s.indexOf('\n') !== -1) {
          s = '"' + s.replace(/"/g, '""') + '"';
        }
        return s;
      }).join(',');
    }).join('\n');

    var now = new Date();
    var fname = 'laporan-penjualan-' + now.getFullYear() + ('0'+(now.getMonth()+1)).slice(-2) + ('0'+now.getDate()).slice(-2) + '.csv';
    var blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = fname; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function() { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
    showToast('Export berhasil: ' + fname, 'success');
  }

  // Hapus transaksi dari laporan
  function confirmHapusTransaksi(idTransaksi, status) {
    var pesanStok = status === 'Selesai' ? '\n\nApakah stok produk ingin dikembalikan?' : '';
    var konfirmasi = confirm('🗑️ Hapus transaksi ' + idTransaksi + '?' + pesanStok + '\n\nData akan dihapus permanen dari database!');
    if (!konfirmasi) return;

    var kembalikanStok = false;
    if (status === 'Selesai') {
      kembalikanStok = confirm('Kembalikan stok produk dari transaksi ini?\n(Klik OK = kembalikan stok, Batal = hapus tanpa kembalikan stok)');
    }

    showLoading(true);
    google.script.run
      .withSuccessHandler(function (res) {
        showLoading(false);
        if (res && res.success) {
          showToast(res.message, 'success');

          // 1. Hapus dari cache riwayat (tanpa server call tambahan)
          _allRiwayatData = _allRiwayatData.filter(function (t) {
            return t.id !== idTransaksi;
          });
          _filteredRiwayatData = _filteredRiwayatData.filter(function (t) {
            return t.id !== idTransaksi;
          });
          // Re-render riwayat jika halaman riwayat sudah pernah dimuat
          if (document.getElementById('riwayat-tbody')) {
            renderRiwayat(_filteredRiwayatData);
          }

          // 2. Reload laporan jika halaman laporan sedang aktif
          if (APP.halamanAktif === 'laporan') loadLaporan();

          // 3. Kembalikan stok di kasir jika dipilih
          if (kembalikanStok) refreshMainProduk();
        } else {
          showToast(res ? res.message : 'Gagal menghapus', 'error');
        }
      })
      .withFailureHandler(function (err) {
        showLoading(false);
        showToast('Error: ' + (err ? err.message : 'Gagal'), 'error');
      })
      .hapusTransaksi(idTransaksi, kembalikanStok);
  }

  function loadStatusNotifEmail() {
    var statusText = document.getElementById('notif-status-text');
    var senderText = document.getElementById('notif-sender-text');
    var quotaText  = document.getElementById('notif-quota-text');
    var lastSent   = document.getElementById('notif-last-sent-text');
    var lowstock   = document.getElementById('notif-lowstock-text');
    var badge      = document.getElementById('notif-auth-badge');
    var warning    = document.getElementById('notif-auth-warning');

    if (statusText) statusText.textContent = 'Memeriksa...';
    if (badge) { badge.style.display = 'none'; }

    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.success) return;
        var d = res.data;

        // Status otorisasi
        if (statusText) {
          if (d.sudahOtorisasi) {
            statusText.innerHTML = '<span style="color:#16a34a;">✅ Terotorisasi</span>';
          } else {
            statusText.innerHTML = '<span style="color:#dc2626;">❌ Belum Diotorisasi</span>';
          }
        }

        // Badge di card header
        if (badge) {
          badge.style.display = 'inline-block';
          if (d.sudahOtorisasi) {
            badge.style.background = '#dcfce7';
            badge.style.color = '#166534';
            badge.textContent = '✅ Aktif';
          } else {
            badge.style.background = '#fee2e2';
            badge.style.color = '#991b1b';
            badge.textContent = '❌ Perlu Otorisasi';
          }
        }

        // Panel peringatan
        if (warning) {
          warning.style.display = d.sudahOtorisasi ? 'none' : 'block';
        }

        // Email pengirim
        if (senderText) {
          senderText.textContent = d.emailPengirim
            ? d.emailPengirim
            : '(otorisasi diperlukan)';
        }

        // Kuota harian
        if (quotaText) {
          if (d.kuotaTersisa !== null && d.kuotaTersisa !== undefined) {
            var kuotaColor = d.kuotaTersisa > 50 ? '#16a34a' : d.kuotaTersisa > 10 ? '#f59e0b' : '#dc2626';
            quotaText.innerHTML = '<span style="color:' + kuotaColor + ';font-weight:700;">' + d.kuotaTersisa + '</span> email/hari tersisa';
          } else {
            quotaText.textContent = d.sudahOtorisasi ? '—' : 'Perlu otorisasi';
          }
        }

        // Terkirim terakhir
        if (lastSent) {
          lastSent.textContent = d.lastSent || 'Belum pernah dikirim';
        }

        // Jumlah low stock
        if (lowstock) {
          if (d.lowStockCount > 0) {
            lowstock.innerHTML = '<span style="color:#dc2626;font-weight:700;">' + d.lowStockCount + ' bahan</span> di bawah minimum';
          } else {
            lowstock.innerHTML = '<span style="color:#16a34a;">✅ Semua stok aman</span>';
          }
        }

        // Disable tombol kirim tes jika belum otorisasi
        var btnTes = document.getElementById('btn-kirim-tes');
        if (btnTes) {
          btnTes.disabled = !d.sudahOtorisasi;
          btnTes.title = d.sudahOtorisasi ? '' : 'Otorisasi MailApp diperlukan terlebih dahulu';
        }
      })
      .withFailureHandler(function(e) {
        if (statusText) statusText.textContent = 'Gagal memeriksa';
      })
      .getStatusNotifEmail();
  }

  function isValidEmailList(raw) {
    var text = String(raw || '').trim();
    if (!text) return true;
    var parts = text.split(/[;,]/);
    for (var i = 0; i < parts.length; i++) {
      var email = String(parts[i] || '').trim();
      if (!email) continue;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return false;
    }
    return true;
  }
