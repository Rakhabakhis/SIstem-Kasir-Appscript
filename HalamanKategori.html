<!-- =====================================================
     HALAMAN KATEGORI - Category Management Page
     ===================================================== -->

<div class="page-header">
  <div class="page-title-row">
    <button class="mobile-toggle" onclick="toggleSidebar()">
      <span class="material-icons-round">menu</span>
    </button>
    <h1 class="page-title">Manajemen Kategori</h1>
  </div>
</div>

<div class="page-body">
  <!-- Tambah Kategori -->
  <div class="card" style="margin-bottom:24px">
    <div class="card-header">
      <h3 style="font-weight:700;font-size:15px;">
        <span class="material-icons-round" style="font-size:18px;vertical-align:middle;color:var(--primary)">add_circle</span>
        Tambah Kategori Baru
      </h3>
    </div>
    <div class="card-body">
      <form id="kategori-form" onsubmit="event.preventDefault();submitTambahKategori()">
        <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
          <div class="form-group" style="flex:1;min-width:200px;margin-bottom:0;">
            <label class="form-label">Nama Kategori *</label>
            <input type="text" id="input-kategori-baru" class="form-control" placeholder="Contoh: Makanan, Minuman..." required>
          </div>
          <button type="submit" class="btn btn-primary" style="height:42px;">
            <span class="material-icons-round">add</span> Tambah
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Daftar Kategori -->
  <div class="card">
    <div class="card-header">
      <h3 style="font-weight:700;font-size:15px;">
        <span class="material-icons-round" style="font-size:18px;vertical-align:middle;color:var(--primary)">category</span>
        Daftar Kategori
      </h3>
      <span id="kategori-count" style="font-size:12px;color:var(--text-muted)"></span>
    </div>
    <div id="kategori-list-container" style="padding:16px 20px;">
      <div style="text-align:center;padding:24px;color:var(--text-muted)">Memuat kategori...</div>
    </div>
  </div>
</div>
